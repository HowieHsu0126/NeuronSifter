schemas:
  native_stochastic_smoke:
    schema_version: native_stochastic_smoke.v1
    weights_status: randomly_initialized
    scientific_quality: NOT_EVALUATED
    required_fields: [schema_version, smoke_status, weights_status, scientific_quality, publication_eligible, model_parameters, native_backbone_parameters, normalization_id, groups, actual_calls, resources]
    input_scope: original_public_initial_support_observations_and_programs_only
    target_arrays: forbidden
    completion_scope: full_native_runtime_only_not_training_or_scientific_qualification
  native_public_cns_reference:
    schema_version: native_public_cns_reference.v1
    required_fields: [schema_version, policy, fit_role, training_records, training_group_uids, endpoints, endpoint_units, status, scientific_twin, formal_qualification, reference_id]
    fit_roles: [train]
    unavailable_scale: constant_or_unsupported_endpoint
  native_adaptive_scale_policy:
    schema_version: native_adaptive_scale_policy.v1
    status_variants:
      insufficient_data:
        required_fields: [schema_version, method, command, status, denominator, reason, model_calls, additional_optimizer_updates, source_provider_calls, calibration_outcome_access, scientific_twin, formal_qualification]
        zero_fields: [model_calls, additional_optimizer_updates, source_provider_calls]
        false_fields: [calibration_outcome_access, formal_qualification]
        forbidden_fields: [binding, policy_id, thresholds, calibration_id, fit_calibration_id, quantiles]
    required_fields: [schema_version, status, definition_status, binding, policy_id, thresholds, fit_role, fit_group_uids, denominator, development_collection, mean_selected_controlled_oracle_regret, mean_resident_cost_seconds, large_only_mean_resident_cost_seconds]
    fit_role: development
    additional_optimizer_updates: 0
  native_scale_selected_calibration:
    schema_version: native_scale_selected_calibration.v1
    status_variants:
      insufficient_data:
        required_fields: [schema_version, method, command, status, denominator, reason, model_calls, additional_optimizer_updates, source_provider_calls, calibration_outcome_access, scientific_twin, formal_qualification]
        zero_fields: [model_calls, additional_optimizer_updates, source_provider_calls]
        false_fields: [calibration_outcome_access, formal_qualification]
        forbidden_fields: [binding, policy_id, thresholds, calibration_id, fit_calibration_id, quantiles]
    required_fields: [schema_version, status, binding, policy_id, calibration_id, fit_calibration_id, fit_group_uids, check_group_uids, quantiles, independent_check_complete, check_coverage]
    fit_reservation: fit
    check_reservation: check
    threshold_reservation_used: false
  native_scale_evaluation:
    schema_version: native_scale_evaluation.v1
    status_variants:
      insufficient_data:
        required_fields: [schema_version, method, command, status, denominator, reason, model_calls, additional_optimizer_updates, source_provider_calls, calibration_outcome_access, scientific_twin, formal_qualification]
        zero_fields: [model_calls, additional_optimizer_updates, source_provider_calls]
        false_fields: [calibration_outcome_access, formal_qualification]
        forbidden_fields: [binding, policy_id, thresholds, calibration_id, fit_calibration_id, quantiles]
    required_fields: [schema_version, method, routing_policy, conditioning, reference_id, upstream_checkpoints, declared_group_count, groups, status, scientific_twin, formal_qualification]
    decision_input: initial_support_retained_observations_compiled_actions_only
    cost: actual_requested_stage_calls_and_measured_execution
  native_intervention_evaluation:
    schema_version: native_intervention_evaluation.v1
    required_fields: [schema_version, method, binding, reference_id, groups, declared_group_count, status, scientific_twin, formal_qualification]
  controlled_neural_observable_source:
    required_fields: [source_identity, definition, groups, cases, operations, resource_limit, source_status]
    production_groups: 18
    production_cases: 36
    production_operations: 390
    operation_replay: forbidden
  physical_target_site_domain:
    required_fields: [mask, semantics, excluded_site_meaning, evidence_ref]
    semantics: target_program_support_not_concentration_absence
    excluded_site_meaning: outside_declared_target_program
    legacy_default: complete_grid_coverage
  native_numerical_stimulation_program:
    schema_version: native_numerical_stimulation_program.v1
    required_fields: [program_uid, action_uid, action_field, time_grid, quantity_profile_sha256, arrays]
    forcing_arrays: [electrical_current_uA, electrical_applicability, optical_power_mW, optical_applicability]
  native_diffusion_family_index:
    schema_version: native_diffusion_family_index.v1
    required_fields: [schema_version, quantity_profile_sha256, family_registries]
    selection: explicit_source_family_uid
  native_observable_field_normalization:
    schema_version: native_field_normalization.v2
    rule: qc_weighted_supported_cells_with_complete_particle_haar_support
    required_fields: [domain, registered_grids, training_records, supported_cell_count, weighted_supported_cell_count]
    fit_role: train
  native_observable_quantity_profile:
    schema_version: native_observable_quantity_profile.v1
    required_fields: [profile_uid, quantities, region_id, compartment_id, families]
    core_quantity_count: 15
    auxiliary_quantity_count: 11
    family_grid_lengths: [7, 8, 7]
  native_exact_zero_uncertainty:
    required_fields: [status, derivation_kind, derivation_ref, serialization_error, source_snapshot_ref, quantity]
  native_transolver_residual:
    schema_version: native_transolver_residual.v1
    required_fields: [schema_version, status, law, reference_time_hours, scales, binding, numerical, partition, admission, fit_target_records, counts, diagnostics, cost, scientific_twin_status]
  native_causal_prefix:
    schema_version: native_causal_prefix.v1
    contrast_fields:
    - contrast_uid
    - sample_uid
    - episode_uid
    - regimen_uids
    - future_knot_hours
    required_fields:
    - schema_version
    - operation
    - status
    - diagnostic_status
    - causal_decision_rule_status
    - protocol
    - contrasts
    - episodes
    - provenance
    - metrics
    - counts
    row_required_fields:
    - declared_index
    - declaration
    - contrast_uid
    - sample_uid
    - episode_uid
    - regimen_uids
    - future_knot_hours
    - source_uid
    - family_uid
    - episode_identity
    - status
    - reason
    - configured_draw_count
    - realized_draw_count
    - prefix_time_count
    - valid_coordinate_count
    - prepared_binding
    - energy_u_statistic
    - mc_standard_error
    - mc_uncertainty_status
    - paired_path_rms
    - prediction_provenance
    defined_statuses:
    - defined
    - undefined
    - failed
    decision_rule_status: unbound
  native_rollout_metrics:
    schema_version: native_rollout_metrics.v1
    protocol_required_fields: [draw_semantics, crps_estimator, quantile_interpolation, quantile_levels, nominal_coverage, normalization_id]
    draw_semantics: [emitted_whole_particle_mixture_draws, deterministic_point_mass, mean_only]
    required_fields: [schema_version, status, source_status, metrics, episodes, protocol, provenance, counts]
    episode_required_fields: [episode_uid, sample_uid, family_uid, group_kind, source_uid, regimen_uids, action_uids, trajectory_uids, posterior_uids, status, draw_count, total_cell_count, valid_cell_count, metrics]
  native_direct_mean_checkpoint:
    required_fields: [prediction_kind, residual_likelihood_status, model_identity, effective_config, conditioning_identity, training_source_registry, training_sources]
  native_linear_dynamics:
    schema_version: native_linear_dynamics.v1
    definition:
      equation: dx_dtau=A*x+B*p_left+C*z+b
      state_coordinates: fixed_r60_normalized
      program_hold: left_endpoint
      transition: augmented_matrix_exponential
      transition_dtype: float64
      time_unit: hour
      initialization: zero_predictor
    state_axes:
    - region
    - compartment
    - species
    program_axes:
    - region
    - compartment
    - occupancy_support
    context_axes:
    - region
    - compartment
    - context
    parameters:
    - A
    - B
    - C
    - b
    prediction_kind: mean_only
    residual_likelihood_status: unbound
    predictive_law_draw_count: 0
    router_status: not_applicable
  native_transolver_mean_checkpoint:
    required_fields: [prediction_kind, residual_likelihood_status, model_identity, effective_config, conditioning_identity, training_source_registry, training_sources]
  native_predictive_source_units:
    required_fields: [episode_field, group_field, group_kind, independent_episode_units, evidence_ref]
  native_training_seed_binding:
    schema_version: native_training_seed_binding.v1
    required_fields: [schema_version, seed_policy, allowed_training_seeds, selected_formal_seed, base_training_seed, model_seed, scope]
