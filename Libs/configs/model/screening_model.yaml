screening_pipeline:
  canonical_entity_policy:
    gene_namespace: entrez_gene_id
    gene_entity_type: gene
    gene_symbol_regex: ^[A-Za-z0-9][A-Za-z0-9\-\.]{1,}$
    excluded_gene_prefixes:
    - MR
    - RC
    - PM
    target_symbol_match_priority:
    - canonical_entity_label
    - source_gene_symbol
  drug_target_ready_registry:
    local_root: Input/processed
    disease_name_patterns:
    - alzheimer
    - alzheimers
    - aging
    - parkinson
    - parkinsons
    - pd
    relative_paths:
      target_catalog: drug_target_ready/target_catalog.tsv
      compound_catalog: drug_target_ready/compound_catalog.tsv
      drug_target_edge_catalog: drug_target_ready/drug_target_edge_catalog.tsv
      target_evidence_catalog: drug_target_ready/target_evidence_catalog.tsv
      compound_feature_catalog: drug_target_ready/compound_feature_catalog.tsv
      drug_target_exclusion_catalog: drug_target_ready/drug_target_exclusion_catalog.tsv
  pkpd_ready_registry:
    local_root: Input/processed
    compound_prior_formula:
      default_permeability_score: 0.5
      default_exposure_scale: 1.0
      default_clearance_scale: 1.0
      logp_center: 2.0
      logp_scale: 4.0
    compartments:
    - compartment_id: plasma
      compartment_label: Plasma
      compartment_role: systemic
      upstream_compartment_id: ''
      note: systemic exposure compartment
    - compartment_id: bbb_interface
      compartment_label: BBB Interface
      compartment_role: transfer
      upstream_compartment_id: plasma
      note: blood-brain barrier transfer compartment
    - compartment_id: csf
      compartment_label: Cerebrospinal Fluid
      compartment_role: central_nervous_system
      upstream_compartment_id: bbb_interface
      note: csf exposure compartment
    - compartment_id: pvs
      compartment_label: Perivascular Space
      compartment_role: central_nervous_system
      upstream_compartment_id: csf
      note: perivascular space compartment
    - compartment_id: isf
      compartment_label: Interstitial Fluid
      compartment_role: central_nervous_system
      upstream_compartment_id: pvs
      note: parenchymal interstitial compartment
    - compartment_id: meningeal_drainage
      compartment_label: Meningeal Drainage
      compartment_role: clearance
      upstream_compartment_id: csf
      note: meningeal lymphatic drainage compartment
    bootstrap_parameter_priors:
    - parameter_name: plasma_to_bbb_rate
      compartment_id: bbb_interface
      unit: relative_rate
      lower_bound: 0.05
      upper_bound: 1.0
      distribution_family: uniform
      central_value: 0.3
      source_repository: bootstrap_config
      provenance_level: inferred
      note: screening bootstrap prior
    - parameter_name: bbb_to_csf_rate
      compartment_id: csf
      unit: relative_rate
      lower_bound: 0.01
      upper_bound: 0.5
      distribution_family: uniform
      central_value: 0.1
      source_repository: bootstrap_config
      provenance_level: inferred
      note: screening bootstrap prior
    - parameter_name: csf_to_pvs_rate
      compartment_id: pvs
      unit: relative_rate
      lower_bound: 0.05
      upper_bound: 1.0
      distribution_family: uniform
      central_value: 0.25
      source_repository: bootstrap_config
      provenance_level: inferred
      note: screening bootstrap prior
    - parameter_name: pvs_to_isf_rate
      compartment_id: isf
      unit: relative_rate
      lower_bound: 0.05
      upper_bound: 0.75
      distribution_family: uniform
      central_value: 0.2
      source_repository: bootstrap_config
      provenance_level: inferred
      note: screening bootstrap prior
    - parameter_name: csf_to_meningeal_clearance_rate
      compartment_id: meningeal_drainage
      unit: relative_rate
      lower_bound: 0.01
      upper_bound: 0.5
      distribution_family: uniform
      central_value: 0.08
      source_repository: bootstrap_config
      provenance_level: inferred
      note: screening bootstrap prior
    routes:
    - route: oral
      absorption_scale: 0.6
      bbb_scale: 1.0
      csf_scale: 0.8
      note: oral route prior
    - route: intravenous
      absorption_scale: 1.0
      bbb_scale: 1.0
      csf_scale: 1.0
      note: intravenous route prior
    - route: intrathecal
      absorption_scale: 0.9
      bbb_scale: 0.5
      csf_scale: 1.3
      note: intrathecal route prior
    schedules:
    - schedule: daily
      frequency_per_day: 1.0
      exposure_scale: 1.0
      note: daily dosing prior
    - schedule: twice_daily
      frequency_per_day: 2.0
      exposure_scale: 1.25
      note: twice daily dosing prior
    - schedule: weekly
      frequency_per_day: 0.142857
      exposure_scale: 0.7
      note: weekly dosing prior
    dose_grid:
    - dose_level_id: dose_025
      dose_multiplier: 0.25
      note: quarter dose
    - dose_level_id: dose_050
      dose_multiplier: 0.5
      note: half dose
    - dose_level_id: dose_100
      dose_multiplier: 1.0
      note: reference dose
    - dose_level_id: dose_200
      dose_multiplier: 2.0
      note: double dose
    relative_paths:
      compartment_catalog: pkpd_ready/compartment_catalog.tsv
      parameter_prior_catalog: pkpd_ready/parameter_prior_catalog.tsv
      compound_pk_prior_catalog: pkpd_ready/compound_pk_prior_catalog.tsv
      route_catalog: pkpd_ready/route_catalog.tsv
      schedule_catalog: pkpd_ready/schedule_catalog.tsv
      dose_grid_catalog: pkpd_ready/dose_grid_catalog.tsv
  action_ready_registry:
    local_root: Input/processed
    minimum_atlas_program_coverage: 0.5
    minimum_atlas_program_feature_hits: 16
    maximum_single_compounds: 128
    maximum_pairwise_compounds: 24
    maximum_pairwise_regimens: 256
    forced_include_compounds: []
    forced_include_targets: []
    relative_paths:
      atlas_program_feature_mapping: action_ready/atlas_program_feature_mapping.tsv
      target_program_catalog: action_ready/target_program_catalog.tsv
      drug_program_catalog: action_ready/drug_program_catalog.tsv
      regimen_catalog: action_ready/regimen_catalog.tsv
      action_exclusion_catalog: action_ready/action_exclusion_catalog.tsv
      build_manifest: action_ready/build_manifest.json
  screening_benchmark:
    benchmark_name: ad_screening_system_public_ad_aging
    artifact_root: Output/results/ad_screening_system
    active_disease_program: ad_control
    disease_families:
    - AD
    - PD
    - FTD
    - ALS
    capability_acceptance:
      structured_world_state:
        hidden_state_support_required: true
        cross_scene_compatibility_required: true
        required_factor_ids:
        - z_tx
        - z_pk
        - z_env
        - z_ephys
        - z_morph
        minimum_crossmodal_anchor_count: 1
        minimum_missing_modality_count: 1
      causal_dynamics:
        action_conditioned_required: true
        conservation_check_required: true
        contradiction_free_required: true
        maximum_concentration_nrmse: 1.5
        maximum_flux_nrmse: 1.5
        minimum_route_ordering_hit: 0.5
      long_horizon_action_rollout:
        short_horizon_step_count: 1
        medium_horizon_step_count: 7
        long_horizon_step_count: 28
        stability_required: true
        maximum_concentration_nrmse: 1.5
        maximum_electrophysiology_nrmse: 1.5
        minimum_pkpd_consistency_mean: 0.4
      counterfactual_planning:
        planning_gain_required: true
        counterfactual_consistency_required: true
        minimum_counterfactual_pair_count: 1
        minimum_regimen_ndcg_at_10: 0.1
      multimodal_alignment:
        required_modalities:
        - transcriptomics
        - morphology
        - electrophysiology
        - pharmacology
        maximum_interactive_latency_ms: 5000.0
        minimum_crossmodal_anchor_count: 1
      online_continual_calibration:
        gated_online_update_required: true
        drift_detection_required: true
        minimum_feedback_event_count: 1
      high_order:
        causal_robustness_required: true
        hierarchical_generalization_required: true
        interacting_subsystems_required: true
        explanation_required: true
        drift_adaptation_required: true
        minimum_ood_auroc: 0.5
        minimum_target_ndcg_at_10: 0.1
        minimum_regimen_ndcg_at_10: 0.1
        minimum_simulation_teacher_count: 1
        minimum_acceptance_benefit: 0.0
    formal_seed_values:
    - 3407
    - 42
    - 26
    target_family_holdout_fraction: 0.2
    scaffold_holdout_fraction: 0.2
    perturbagen_holdout_fraction: 0.2
    tri_threshold: 0.45
    component_switches:
      atlas_prior_consistency: true
      clue_signature_reversal: true
      drug_target_evidence_ranking: true
      pkpd_prior_consistency: true
      structural_prior: true
      local_response_heads: true
      tri_gate: true
    loss_weights:
      diagnosis_classification_loss: 1.0
      atlas_prior_consistency_loss: 0.3
      clue_signature_reversal_loss: 0.2
      drug_target_evidence_ranking_loss: 0.6
      pkpd_physics_loss: 0.4
      transition_supervision_loss: 0.4
      simulation_teacher_factor_loss: 0.25
      world_state_target_loss: 0.2
      world_state_consistency_loss: 0.15
      counterfactual_planning_loss: 0.2
      tri_supervision_loss: 0.2
      observation_reconstruction_loss: 0.2
      transition_regularization_loss: 0.1
      quantized_mddm_rollout_loss: 0.1
    foundation_training:
      world_state_factorization:
        minimum_factor_std: 0.05
        orthogonality_weight: 0.5
        hidden_state_weight_scale: 1.0
      counterfactual_planning:
        pairwise_margin: 0.1
      simulation_teacher:
        z_pk_weight: 1.0
        z_env_weight: 1.0
        z_ephys_weight: 1.0
    pkpd_prior_consistency:
      compartment_order:
      - plasma
      - bbb_interface
      - csf
      - pvs
      - isf
      - meningeal_drainage
      exposure_target_by_compartment:
        plasma: 0.7
        bbb_interface: 0.48
        csf: 0.34
        pvs: 0.28
        isf: 0.24
        meningeal_drainage: 0.16
      occupancy_target_by_compartment:
        plasma: 0.16
        bbb_interface: 0.14
        csf: 0.12
        pvs: 0.1
        isf: 0.1
        meningeal_drainage: 0.06
      route_exposure_multiplier:
        oral:
          plasma: 0.7
          bbb_interface: 0.8
          csf: 0.7
          pvs: 0.7
          isf: 0.65
          meningeal_drainage: 0.6
        intravenous:
          plasma: 1.0
          bbb_interface: 0.95
          csf: 0.85
          pvs: 0.8
          isf: 0.78
          meningeal_drainage: 0.7
        intrathecal:
          plasma: 0.45
          bbb_interface: 0.55
          csf: 1.25
          pvs: 1.1
          isf: 1.05
          meningeal_drainage: 1.2
      route_occupancy_multiplier:
        oral: 0.75
        intravenous: 0.9
        intrathecal: 1.15
      schedule_exposure_multiplier:
        daily: 1.0
        twice_daily: 1.25
        weekly: 0.7
      schedule_occupancy_multiplier:
        daily: 1.0
        twice_daily: 1.12
        weekly: 0.8
      dose_multiplier_lower_bound: 0.25
      dose_multiplier_upper_bound: 2.0
      dose_exposure_exponent: 0.5
      dose_occupancy_exponent: 0.75
      occupancy_lower_bound: 0.02
      occupancy_upper_bound: 0.85
      exposure_alignment_weight: 1.0
      occupancy_alignment_weight: 1.0
      dose_feasibility_weight: 0.25
      pk_feasibility_alignment_weight: 0.5
    regimen_score_weights:
      reversal_gain: 0.25
      target_evidence: 0.35
      pk_feasibility: 0.2
      atlas_consistency: 0.15
      ood_penalty: 0.05
    tri_weights:
      calibration: 0.25
      coverage: 0.2
      pkpd_physics_consistency: 0.2
      ranking_stability: 0.2
      ood_score: 0.15
    uq:
      temperature_grid:
      - 0.5
      - 0.75
      - 1.0
      - 1.25
      - 1.5
      - 2.0
      ece_bin_count: 10
      ace_bin_count: 10
      risk_coverage_grid_size: 21
      target_acceptance_coverage: 0.8
    ensemble_uq:
      member_seed_values:
      - 3407
      - 42
      - 26
      minimum_member_count: 2
      aggregation_rule: mean_and_standard_deviation
      calibrated_decision_policy: risk_coverage_threshold
      current_mainline_discovery:
        profile_name: dynamics_mainline_ad
        artifact_root: Output/results/dynamics_formal
        benchmark_name_template: dynamics_twin_ad_mainline_seed_{seed}
        checkpoint_relative_path: folds/{fold_name}/ad_screening_system/model_weights.pt
        manifest_relative_path: folds/{fold_name}/ad_screening_system/training_manifest.json
        allowed_fold_names:
        - heldout_st000433
        - heldout_st004168
        expected_model_name: ad_screening_system
        expected_model_contract_version: ad_full_microenvironment_v2
        uncertainty_metric: mutual_information
    long_horizon_rollout:
      horizon_days: 28
      fast_step_hours: 6
      slow_step_days: 1
      slow_step_count: 28
      fast_steps_per_slow_step: 4
      slow_update_scale: 0.25
      fast_state_species_ids:
      - free_drug
      - target_bound_drug
      - clearance_flux
      - calcium_concentration
      - membrane_voltage
      - spike_rate
      - vascular_perivascular_transport
      microenvironment_teacher_layers:
        pbpk:
        - free_drug
        - target_bound_drug
        - vascular_perivascular_transport
        neuron_rxd_electrophysiology:
        - calcium_concentration
        - membrane_voltage
        - spike_rate
        - circuit_instability
        protein_pathology:
        - misfolded_protein_load
        - aggregate_burden
        - amyloid_beta_soluble
        - amyloid_plaque
        - phosphorylated_tau
        inflammatory_transport:
        - neuroinflammation
        - inflammatory_mediator
        - clearance_flux
      slow_state_species_ids:
      - misfolded_protein_load
      - aggregate_burden
      - neuroinflammation
      - circuit_instability
      - amyloid_beta_soluble
      - amyloid_plaque
      - phosphorylated_tau
      - inflammatory_mediator
    active_learning:
      acquisition_batch_size: 128
      contract_name: decision_centric_simulator_portfolio_active_learning
      full_round_count: 3
      full_tasks_per_round: 128
      smoke_tasks_per_round: 6
      active_rounds:
      - round_uid: al_discovery
        round_index: 1
        update_policy: full_neuronsifter_large_update
      - round_uid: al_refinement
        round_index: 2
        update_policy: full_neuronsifter_large_update
      - round_uid: al_confirmation
        round_index: 3
        update_policy: full_neuronsifter_large_update
      batch_quota:
        exploitation: 0.40
        exploration: 0.40
        sentinel: 0.20
      quota_sum: 1.00
      mandatory_public_sources:
      - open_targets
      - chembl
      - bindingdb
      - drugcentral
      - dgidb
      - drugcomb
      - lincs_clue_sigcom
      mandatory_tool_sources:
      - osp_pksim_mobi
      - rdkit
      - moleculenet_deepchem
      - autodock_vina_gnina
      mandatory_simulator_families:
      - public_evidence_refresh
      - rdkit_descriptor
      - deepchem_moleculenet
      - osp_pksim_mobi
      - neuron_rxd
      - full_microenvironment
      - vina_gnina
      fail_fast_on_missing_mandatory_source: true
      fail_fast_on_missing_mandatory_tool: true
      fail_fast_on_pending_empirical_artifacts: true
      artifact_root: Input/processed/active_learning
      relative_paths:
        candidate_pool_template: active_candidate_pool_{round_uid}.tsv
        acquisition_scores_template: acquisition_scores_{round_uid}.tsv
        request_batch_template: simulation_request_batch_{round_uid}.tsv
        completed_tool_result_template: completed_tool_result_manifest_{round_uid}.tsv
        result_manifest_template: simulation_result_manifest_{round_uid}.tsv
        teacher_update_template: teacher_manifest_update_{round_uid}.tsv
        priority_catalog: active_learning_priority_catalog.tsv
        qc_summary_template: active_learning_qc_summary_{round_uid}.json
        round_report_template: active_learning_round_report_{round_uid}.json
        preflight_audit: active_learning_preflight_audit.json
        loop_summary: active_learning_loop_summary.json
      priority_seed:
        score_min: 0.0
        score_max: 1.0
        source_holdout_role: active_learning_source_prior
        target_evidence_key: aggregate_target_evidence_score
        perturbation_reversal_key: clue_reversal_proxy_score
        validation_readiness_weights:
          affinity_evidence_score: 0.30
          admet_readiness_score: 0.35
          pbpk_readiness_score: 0.35
        uncertainty_component_weights:
          predictive_entropy_mean: 0.34
          mutual_information_mean: 0.33
          epistemic_std_mean: 0.33
      simulation_request_defaults:
        time_grid: ad_long_horizon_days_0_540
        region_grid: cns_region_compartment_graph_v1
        compartment_grid: plasma_bbb_csf_pvs_isf_meningeal_drainage
        species_list: cns_microenvironment_species_v1
        parameter_prior_uid: ad_public_only_cns_pkpd_prior_v1
        uncertainty_policy: teacher_uncertainty_required
      result_linking:
        artifact_sources:
          public_evidence_refresh:
            source_type: external_adapter_processed
            adapter_source_key: lincs_clue_sigcom
          rdkit_descriptor:
            source_type: external_adapter_processed
            adapter_source_key: rdkit
          deepchem_moleculenet:
            source_type: external_adapter_processed
            adapter_source_key: moleculenet_deepchem
          osp_pksim_mobi:
            source_type: full_microenvironment_registry
            relative_path_key: pbpk_rollout_catalog
          neuron_rxd:
            source_type: full_microenvironment_registry
            relative_path_key: neuron_rxd_protocol_catalog
          full_microenvironment:
            source_type: full_microenvironment_registry
            relative_path_key: full_microenvironment_teacher_catalog
          vina_gnina:
            source_type: candidate_validation_execution_catalog
            relative_path_key: execution_catalog
        axis_hashes:
          time_axis_hash: ad_long_horizon_days_0_540
          region_axis_hash: cns_region_compartment_graph_v1
          compartment_axis_hash: plasma_bbb_csf_pvs_isf_meningeal_drainage
          species_axis_hash: cns_microenvironment_species_v1
        result_policy_by_training_label_policy:
          teacher_family:
            qc_grade: A
            qc_use: main_pretraining
            sample_weight: 1.0
          not_dynamics_label:
            qc_grade: C
            qc_use: weak_teacher_calibration
            sample_weight: 0.25
          downstream_validation_only:
            qc_grade: C
            qc_use: candidate_validation_update
            sample_weight: 0.20
      weights:
        expected_utility: 0.45
        epistemic_uncertainty: 0.1
        diversity: 0.1
        pkpd_feasibility: 0.15
        safety_penalty: 0.05
        validation_readiness: 0.25
        expected_information_gain: 0.16
        rank_flip_risk: 0.14
        tri_uncertainty: 0.14
        counterfactual_disagreement: 0.12
        ood_gap: 0.12
        mechanism_expert_disagreement: 0.12
        simulator_cost_penalty: 0.10
        risk_penalty: 0.10
      simulator_portfolio:
      - simulator_family: public_evidence_refresh
        fidelity_level: L0
        adapter_source_key: lincs_clue_sigcom
        cost_weight: 0.05
        request_role: evidence_refresh
        training_label_policy: not_dynamics_label
        required: true
      - simulator_family: rdkit_descriptor
        fidelity_level: L1
        adapter_source_key: rdkit
        cost_weight: 0.08
        request_role: molecular_descriptor
        training_label_policy: not_dynamics_label
        required: true
      - simulator_family: deepchem_moleculenet
        fidelity_level: L1
        adapter_source_key: moleculenet_deepchem
        cost_weight: 0.12
        request_role: molecular_property_baseline
        training_label_policy: not_dynamics_label
        required: true
      - simulator_family: osp_pksim_mobi
        fidelity_level: L2
        adapter_source_key: osp_pksim_mobi
        cost_weight: 0.35
        request_role: pkpd_occupancy_teacher
        training_label_policy: teacher_family
        required: true
      - simulator_family: neuron_rxd
        fidelity_level: L3
        adapter_source_key: neuron_rxd_teacher
        cost_weight: 0.55
        request_role: electrophysiology_rxd_teacher
        training_label_policy: teacher_family
        required: true
      - simulator_family: full_microenvironment
        fidelity_level: L4
        adapter_source_key: full_microenvironment_teacher
        cost_weight: 1.00
        request_role: full_microenvironment_teacher
        training_label_policy: teacher_family
        required: true
      - simulator_family: vina_gnina
        fidelity_level: L5
        adapter_source_key: autodock_vina_gnina
        cost_weight: 0.60
        request_role: downstream_structure_validation
        training_label_policy: downstream_validation_only
        required: true
      batch_role_policy:
        exploitation:
          preferred_decision_labels:
          - active_learning
          - external_validation
          score_column: exploitation_score
          preferred_label_bonus: 0.10
        exploration:
          preferred_decision_labels:
          - insufficient_evidence
          - active_learning
          score_column: exploration_score
          preferred_label_bonus: 0.10
        sentinel:
          preferred_decision_labels:
          - reject
          - insufficient_evidence
          score_column: sentinel_score
          preferred_label_bonus: 0.10
      model_update_policy:
        update_large_every_round: true
        update_student_distillation_every_round: true
        update_world_state_posterior: true
        update_denoiser: true
        update_mechanism_experts: true
        update_ranking_tri_calibration_heads: true
        accepted_qc_uses_for_main_update:
        - main_pretraining
        accepted_qc_uses_for_calibration:
        - weak_teacher_calibration
        stress_qc_use: stress_test_only
      empirical_acceptance:
        require_three_completed_rounds: true
        require_source_holdout_rollout_error_decrease: true
        require_top_k_rank_stability_increase: true
        require_tri_selective_risk_decrease: true
        require_counterfactual_direction_hit_increase: true
        require_ood_false_accept_decrease: true
        bootstrap_interval: paired_bootstrap_95
        bootstrap_sample_count: 2000
        pending_result_status: requires_experiment_result
        completed_result_status: empirical_result_available
    active_learning_replay:
      random_seed: 3407
      evaluation_batch_size: 16
      top_k_values:
      - 10
      - 20
      policies:
      - random
      - expected_utility_only
      - epistemic_uncertainty_only
      - full_acquisition
    validation_reranking:
      weights:
        model_score: 0.4
        tri_score: 0.25
        affinity_evidence: 0.15
        admet_readiness: 0.1
        pbpk_readiness: 0.1
    decision_gate:
      score_accept_threshold: 0.55
      score_active_learning_threshold: 0.55
      tri_accept_threshold: 0.45
      pkpd_consistency_threshold: 0.5
      ood_reject_threshold: 0.75
      accepted_validation_stages:
      - rescored
      - docked
      - structure_profiled
      - knowledge_profiled
      - admet_pbpk_profiled
      decision_labels:
        accept: accept
        reject: reject
        active_learning: active_learning
        external_validation: external_validation
        insufficient_evidence: insufficient_evidence
      policy_equations:
        accept: score_above_threshold_and_tri_pkpd_reliable
        active_learning: high_score_with_low_tri
        external_validation: high_score_with_incomplete_downstream_validation_or_pkpd_gap
        insufficient_evidence: high_ood_or_missing_uq_evidence
        reject: low_score_after_reliability_gating
    clinical_direction_bridge:
