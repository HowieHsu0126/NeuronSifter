    bridge_hyperparameters:
      hidden_channels: 32
      batch_size: 32
      learning_rate: 0.001
      weight_decay: 0.0001
      max_epochs: 20
      sample_limit_per_split: 1024
  - baseline_name: kg_graph_drug_repurposing_baseline
    baseline_family: knowledge_graph_screening
    adapter_name: kg_graph_drug_repurposing
    adapter_mode: local_matched_split_wrapper
    comparison_tier: task_matched_local_graph_candidate
    source_repo_path: ''
    source_url: ''
    publication_year: 2026
    implementation_status: local_matched_split_wrapper_ready
    kg_graph_inputs:
      target_evidence_catalog: Input/processed/drug_target_ready/target_evidence_catalog.tsv
      drug_target_edge_catalog: Input/processed/drug_target_ready/drug_target_edge_catalog.tsv
      regimen_catalog: Input/processed/action_ready/regimen_catalog.tsv
    kg_graph_scoring:
      target_evidence_weight: 0.35
      edge_evidence_weight: 0.30
      edge_affinity_weight: 0.20
      regimen_graph_aggregate_weight: 0.15
      affinity_floor_nm: 1.0
      top_k_regimens: 10
      split_name: source_holdout
      evaluation_scope: graph_evidence_prioritization
      task_name: screening_baselines
      task_family: screening_baseline
    task_coverage:
    - graph_evidence_intervention_prioritization
