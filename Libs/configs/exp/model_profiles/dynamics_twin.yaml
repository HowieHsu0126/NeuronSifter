    - '{python_executable} -u Libs/scripts/validators/validate_sample_observation_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_intervention_program_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_intervention_program_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_candidate_validation_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_candidate_validation_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_external_adapter_processed_catalogs.py --config {config_path}'
