  parent_full_suite_job_id: "508644"
  scope: Resolve Allen 12-family rights and immutable release identities from bounded official public metadata snapshots only
  source_policy:
    access_class: public_uncontrolled
    official_hosts_only: true
    allowed_host_suffixes: [alleninstitute.org, brain-map.org]
    general_terms_satisfy_dataset_specific_rights: false
    historical_release_hint_promotable: false
    mutable_latest_query_allowed: false
    release_identity_requires_official_immutable_evidence: true
    terms_and_release_snapshots_hash_required: true
    checked_at_execution_time_required: true
    redirect_to_non_official_host_allowed: false
  configuration:
    maximum_requests: 48
    max_concurrent_requests: 1
    request_timeout_seconds: 20
    retry_count: 0
    maximum_snapshot_bytes_per_response: 1048576
    maximum_total_snapshot_bytes: 25165824
    accepted_metadata_content_types: [text/html, application/json, application/xml, text/xml, text/csv, text/tab-separated-values]
  output_artifacts:
    rights_matrix: Output/audits/dt_round20_allen_rights_matrix_v2.json
    release_inventory: Input/manifests/allen/allen_release_inventory_v2.tsv
    retrieval_manifest: Input/manifests/allen/allen_retrieval_manifest_v2.json
