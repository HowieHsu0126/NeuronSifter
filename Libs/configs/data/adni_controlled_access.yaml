    split_policy:
      policy_uid: adni_subject_holdout_site_audit
      train_fraction: 0.7
      validation_fraction: 0.15
      test_fraction: 0.15
      assignment_hash_context: adni_subject_holdout_split
      split_names:
      - train
      - validation
      - test
      forbid_subject_overlap: true
      report_site_overlap_matrix: true
      report_diagnosis_transition_counts: true
      report_modality_missingness_profiles: true
      report_cohort_holdout_counts: true
  application:
    benchmark_id: adni_controlled_state_inference_validation
    model_family: screening_checkpoint_world_state_adapter_with_train_split_centroid_calibrator
    screening_checkpoint:
      selection_policy: current_public_mainline_production
      profile_name: dynamics_mainline_ad
      artifact_root: Output/results/dynamics_formal
      benchmark_name_template: dynamics_twin_ad_mainline_seed_{seed}
      seed_value: 3407
      checkpoint_relative_path: production/ad_screening_system/model_weights.pt
      manifest_relative_path: production/ad_screening_system/training_manifest.json
      expected_scope: production
      expected_fold_name: production
      expected_model_name: ad_screening_system
      expected_model_contract_version: ad_full_microenvironment_v2
      required: true
      model_state_key: model_state
      model_kwargs_key: model_kwargs
      state_dict_strict: true
      target_dimension_source: checkpoint_patient_state_dim
    adni_tabular_adapter:
      adapter_name: train_split_state_projection_to_screening_world_state
      fit_split: train
      inference_splits:
      - validation
      - test
      batch_size: 32
      projection_policy:
        kind: train_centered_svd_random_projection_completion
        random_seed: 3407
        minimum_train_samples: 1
        summary_feature_names:
        - centroid_disease_probability
        - matrix_mean
        - matrix_standard_deviation
        - nonzero_fraction
        - disease_differential_projection
        - latent_norm
      posterior_calibration:
        ece_bin_count: 10
      factor_anchoring:
        anchor_features:
        - diagnosis_numeric
        - mmse_total
        - cdrsb_total
        - amyloid_suvr
        - tau_suvr
        - hippocampus_volume
    state_factor_mapping:
      diagnosis_numeric:
        normal: 0
        mild_cognitive_impairment: 1
        dementia_or_ad: 2
      pathology_state:
        amyloid_positive_feature: amyloid_suvr
        tau_positive_feature: tau_suvr
    transition_labels:
      stable: stable
      progression: progression
      improvement: improvement
    pathology_thresholds:
      amyloid_suvr_positive_min: 1.11
      tau_suvr_positive_min: 1.25
    missingness_tasks:
    - task_id: drop_mri
      modality: mri
    - task_id: drop_pet_amyloid
      modality: pet_amyloid
    - task_id: drop_pet_tau
      modality: pet_tau
    - task_id: drop_fdg_pet
      modality: fdg_pet
    - task_id: drop_fluid_biomarkers
      modality: fluid
    holdout_policy:
      forbid_subject_overlap: true
      site_holdout_mode: report_overlap_not_training_signal
      cohort_holdout_mode: report_cohort_counts_by_split
    metrics:
      classification:
      - balanced_accuracy
      - macro_f1
      - sample_count
      calibration:
      - brier_score
      longitudinal:
      - conversion_balanced_accuracy
      - progression_rate_mae
      missingness:
      - balanced_accuracy_delta_from_complete
  validators:
    raw_identifier_min_length: 5
    public_raw_identifier_value_patterns:
    - ^[0-9]{3}_S_[0-9]+$
    require_required_role_coverage: true
    require_train_only_scaler: true
    require_controlled_application_reports: true
    public_scan_roots:
    - Output/paper_reports
    - Output/logs
    public_text_scan_suffixes:
    - .json
    - .tsv
    - .csv
    - .txt
    - .log
    participant_level_output_roots:
    - Input/private/adni
    - Input/processed/adni
    forbidden_public_path_fragments:
    - adni_sample_observation_registry
    - adni_feature_matrix
    - adni_longitudinal_transition_table
    - adni_model_input_registry
    - adni_imaging_inventory
    - model_inputs
    - Input/private/adni
    forbidden_public_json_keys:
    - sample_uid
    - subject_uid_hash
    - visit_uid
    - image_uid_hash
    - site_uid_hash
    - local_path_private
