  - claim_id: no_g5_upgrade_without_gate
    forbidden_fragments:
    - G5 passed
    - 1M trajectory readiness passed
    - materialized 1M trajectory gate passed
  - claim_id: no_general_drug_screening
    forbidden_fragments:
    - general drug screening
    - pan-disease readiness
  - claim_id: no_clinical_endpoint_prediction
    forbidden_fragments:
    - direct clinical endpoint prediction
    - prospective efficacy prediction
  - claim_id: no_private_training_claim
    forbidden_fragments:
