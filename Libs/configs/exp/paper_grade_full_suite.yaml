    interval: paired_bootstrap_95
    bootstrap_sample_count: 2000
    metrics:
    - direction_hit_rate
    - pairwise_anchor_accuracy
    - rank_ndcg
    - mixed_case_calibration
    - tri_consistency
    - pkpd_consistency
    - expert_activation
    require_per_seed_values: true
    fail_on_missing_main_table_metric: true
  manifest_contract:
    required_fields:
    - task_name
    - model_key
    - seed
    - config_hash
    - split_hash
    - checkpoint_hash
    - metrics_json
    - stdout_path
    - stderr_path
    - artifact_hash
    - runtime_metadata
    - postrun_status
    manifest_template: Output/results/paper_grade_full_suite/manifests/{task_name}/{model_key}/seed_{seed}/artifact_manifest.json
