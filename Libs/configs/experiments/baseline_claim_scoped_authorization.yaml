  artifact_producer: build_baseline_claim_scoped_authorization
  validator_producer: validate_baseline_claim_scoped_authorization
  global_fail_closed: true
  global_activation_requires_all_claims: true

# Evidence locations are deliberate declarations, not evidence by themselves.
# None of the initial records exist, so this contract must remain blocked.
claims:
