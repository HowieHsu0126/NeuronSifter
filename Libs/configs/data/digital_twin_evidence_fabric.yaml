      claim_eligibility: endpoint_direction_only
  - adapter_id: drugcomb_holding
    path: Input/processed/external_adapters/drugcomb_combination_prior_catalog.tsv
    reader_type: tsv_records
    required: true
    required_columns: [combination_uid]
    uid_columns: [combination_uid]
    field_sources: {source_uid: [source_key], action_uid: [combination_uid]}
    provenance_fields: [source_release, block_id, source_holdout_role]
    evidence_defaults:
      <<: *frozen_public_prior
      source_uid: drugcomb
  - adapter_id: bindingdb_holding
    path: Input/processed/drug_target_ready/drug_target_edge_catalog.tsv
    reader_type: tsv_records
    required: true
    required_columns: [edge_uid]
    uid_columns: [edge_uid]
    field_sources: {source_uid: [source_key]}
    provenance_fields: [edge_uid, target_uid, compound_uid, bindingdb_ligand_id]
    evidence_defaults:
      <<: *frozen_public_prior
      source_uid: bindingdb
  - adapter_id: mechanistic_model_registry
    path: Input/processed/full_microenvironment_teacher_ready/source_model_catalog.tsv
    reader_type: tsv_records
    required: true
    required_columns: [source_model_uid]
    uid_columns: [source_model_uid]
    field_sources: {model_family_uid: [model_family_uid, source_model_uid]}
    provenance_fields: [source_model_uid, source_model_family, source_url, provenance_level]
    evidence_defaults:
      evidence_type: published_mechanistic_output
      source_uid: mechanistic_model_registry
      publication_accession: null
      biological_unit_uid: null
      state_uid: null
      action_uid: null
      trajectory_uid: null
