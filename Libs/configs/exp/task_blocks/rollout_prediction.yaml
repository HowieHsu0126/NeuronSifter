task_block:
  task_id: rollout_prediction
  task_name: rollout_prediction
  task_family: dynamics_rollout
  description: Paper-grade AD-only rollout_prediction task block.
  shell_entrypoint: Libs/scripts/experiments/run_rollout_prediction.sh
  shell_path: Libs/scripts/experiments/run_rollout_prediction.sh
  python_entrypoint: Libs/exp/evaluation/evaluate_rollout_prediction.py
  python_path: Libs/exp/evaluation/evaluate_rollout_prediction.py
  config_requirements:
  - Libs/configs/config_stack.yaml
  - Libs/configs/exp/paper_grade_full_suite.yaml
  expected_inputs:
  - formal_result_catalogs
  - paired_trajectory_holdouts
  expected_outputs:
  - metrics.json
  - run_metadata.json
  - artifact_hashes.json
  - status.json
  - artifact_manifest.json
  metrics:
  - concentration_nrmse
  - flux_nrmse
  - rollout_nrmse
  - stability_violation_rate
  seeds:
  - 40
  - 41
  - 42
  - 43
  - 44
  resource_profile: cpu_large
  postrun_checks:
  - Libs/scripts/validators/validate_paper_grade_full_suite.py --mode postrun
  claim_guardrails:
  - preserve_ad_only_scope
  - preserve_G2_pass_with_warnings
  - preserve_G5_not_passed
  - no_general_drug_screening_claim
  - no_direct_clinical_endpoint_prediction_claim
  - no_private_clinical_data_training_claim
  - no_secondary_disease_readiness_claim
  status: ready
