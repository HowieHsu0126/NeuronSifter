      <<: *frozen_public_prior
      source_uid: structured_action_catalog
  - adapter_id: clue_touchstone_holding
    path: Input/processed/intervention_program/intervention_program_catalog.tsv
    reader_type: tsv_records
    required: true
    required_columns: [intervention_uid]
    uid_columns: [intervention_uid]
    field_sources: {source_uid: [source_key, source_accession], action_uid: [action_uid, intervention_uid]}
    provenance_fields: [block_id, source_release, modality, source_holdout_role]
    required_row_match:
      field: block_id
      value: GSE92742-TouchstoneV1.1::NPC_NEU_TRT_CP
    evidence_defaults:
      evidence_type: real_perturbation_endpoint
      source_uid: lincs_clue_touchstone
      publication_accession: GSE92742-TouchstoneV1.1
      biological_unit_uid: null
      state_uid: null
      action_uid: null
      trajectory_uid: null
      tool_result_uid: null
      model_family_uid: null
      time_semantics: endpoint
      pairing_semantics: same_unit_action_endpoint
