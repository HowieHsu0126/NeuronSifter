model_input_registry:
  local_root: Input/processed
  enabled_sources:
  - geo
  - arrayexpress
  - metabolomics_workbench
  bundle_root_template: Input/processed/model_input/studies/{source_key}/{source_accession}
  feature_key_prefix: f
  feature_key_width: 6
  bundle_filenames:
    manifest: bundle_manifest.json
    sample_index: sample_index.parquet
    feature_index: feature_index.parquet
    matrix_raw: matrix_raw.npy
    matrix_norm: matrix_norm.npy
    feature_scaler: feature_scaler_artifact.tsv
  normalization_by_semantics:
    expression_signal:
      transform: zscore
      normalization_method: zscore
    metabolite_intensity:
      transform: auto_log1p_then_zscore
      nonnegative_method: log1p_then_zscore
      signed_method: zscore
    methylation_signal:
      transform: zscore
      normalization_method: zscore
    quantitative_signal:
      transform: zscore
      normalization_method: zscore
  relative_paths:
    study_bundle_catalog: model_input/study_bundle_catalog.tsv
    excluded_study_catalog: model_input/excluded_study_catalog.tsv
measurement_semantics_registry:
  local_root: Input/processed
  relative_paths:
    measurement_semantics_catalog: measurement_semantics/measurement_semantics_catalog.tsv
  modality_default_matrix_semantics:
    transcriptomics: expression_signal
    metabolomics: metabolite_intensity
  label_policy:
    separator: '::'
    fallback_label: prohibited_unknown_measurement
  scaler_artifact_policy:
    fold_fit_policy: train_split_only_fit_validation_test_apply
    production_fit_policy: approved_public_training_context
    zero_variance_policy: standardized_zero_with_flag
    missing_value_policy: preserve_nan
    leakage_guard: heldout_rows_never_used_for_fit
    inverse_transform_required: true
  matrix_semantics_definitions:
    expression_signal:
      biological_quantity: transcript_abundance_proxy
      measurement_entity_namespace: gene_or_probe_feature
      raw_unit: arbitrary_expression_signal
      canonical_unit: arbitrary_expression_signal
      unit_conversion_chain: identity_raw_to_canonical_proxy_signal
      proxy_unit_flag: yes
      valid_min: ''
      valid_max: ''
      uncertainty_policy: feature_scaler_sampling_uncertainty
      uncertainty_semantics: featurewise_sampling_uncertainty_in_standardized_proxy_space
      default_training_transform: zscore
      inverse_transform: zscore_inverse_from_feature_scaler
      physical_interpretation_policy: proxy_unit_not_physical_unit
    metabolite_intensity:
      biological_quantity: metabolite_abundance_proxy
      measurement_entity_namespace: metabolite_feature
      raw_unit: arbitrary_metabolite_intensity
      canonical_unit: arbitrary_metabolite_intensity
      unit_conversion_chain: identity_raw_to_canonical_proxy_intensity
      proxy_unit_flag: yes
      valid_min: '0.0'
      valid_max: ''
      uncertainty_policy: log_space_feature_scaler_uncertainty
      uncertainty_semantics: featurewise_log_space_sampling_uncertainty_in_standardized_proxy_space
      default_training_transform: auto_log1p_then_zscore
      inverse_transform: log1p_zscore_inverse_from_feature_scaler_when_nonnegative
      physical_interpretation_policy: proxy_unit_not_physical_unit
    methylation_signal:
      biological_quantity: dna_methylation_fraction_proxy
      measurement_entity_namespace: genomic_feature
      raw_unit: beta_value_or_array_signal
      canonical_unit: beta_value_or_array_signal
      unit_conversion_chain: identity_raw_to_canonical_beta_or_array_proxy
      proxy_unit_flag: yes
      valid_min: '0.0'
      valid_max: '1.0'
      uncertainty_policy: feature_scaler_sampling_uncertainty
      uncertainty_semantics: featurewise_sampling_uncertainty_in_standardized_proxy_space
      default_training_transform: zscore
      inverse_transform: zscore_inverse_from_feature_scaler
      physical_interpretation_policy: proxy_unit_not_physical_unit
    quantitative_signal:
      biological_quantity: quantitative_assay_signal_proxy
      measurement_entity_namespace: assay_feature
      raw_unit: arbitrary_quantitative_signal
      canonical_unit: arbitrary_quantitative_signal
      unit_conversion_chain: identity_raw_to_canonical_quantitative_proxy
      proxy_unit_flag: yes
      valid_min: ''
      valid_max: ''
      uncertainty_policy: feature_scaler_sampling_uncertainty
      uncertainty_semantics: featurewise_sampling_uncertainty_in_standardized_proxy_space
      default_training_transform: zscore
      inverse_transform: zscore_inverse_from_feature_scaler
      physical_interpretation_policy: proxy_unit_not_physical_unit
