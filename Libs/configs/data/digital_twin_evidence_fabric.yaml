  - adapter_id: structured_action_catalog
    path: Input/processed/action_ready/regimen_catalog.tsv
    reader_type: tsv_records
    required: true
    required_columns: [regimen_uid]
    uid_columns: [regimen_uid]
    field_sources: {action_uid: [action_uid, regimen_uid]}
    provenance_fields: [regimen_uid, target_program_uid, route, schedule]
