  conflict_registry:
  - conflict_id: N
    resolution_class: resolved
    rule: Declared canonical or supporting relationship applies without conflict.
  - conflict_id: L
    resolution_class: resolved_contract_migration
    rule: Public and active internal identity is NeuronSifter; legacy names are confined to validated migration-only contexts.
  - conflict_id: C
    resolution_class: resolved
    rule: Frozen v2 claim meanings override the legacy claim namespace without promoting results.
  - conflict_id: P
    resolution_class: resolved_policy_isolation
    rule: The dedicated public-mainline validator proves zero controlled reachability while the explicit controlled branch remains non-default, guarded, and non-evidentiary.
  - conflict_id: D
    resolution_class: pending_numeric_lineage
    rule: Generated audits own current counts until lineage is reconciled.
  - conflict_id: R
    resolution_class: resolved
    rule: Design-preview config and schemas are reference-only; the installed union owns runtime fields.
  - conflict_id: H
    resolution_class: resolved
    rule: Historical, evidence, and generated records cannot override active contracts.
  - conflict_id: V
    resolution_class: pending_external_verification
    rule: Source, literature, and venue currency must be verified from official sources at use time.
  - conflict_id: T
    resolution_class: resolved
    rule: Target paths map into the inspected Libs architecture without parallel pipelines.
  - conflict_id: E
    resolution_class: resolved_empirical_work_pending
    rule: Design-package validation does not satisfy empirical or deployment acceptance.
