task_block:
  task_id: screening_supervised
  task_name: screening_supervised
  task_family: supervised_screening
  description: Paper-grade AD-only screening_supervised task block.
  shell_entrypoint: Libs/scripts/experiments/run_screening_supervised.sh
  shell_path: Libs/scripts/experiments/run_screening_supervised.sh
  python_entrypoint: Libs/exp/training/train_screening_supervised.py
  python_path: Libs/exp/training/train_screening_supervised.py
  config_requirements:
  - Libs/configs/config_stack.yaml
  - Libs/configs/exp/paper_grade_full_suite.yaml
  expected_inputs:
  - model_input_registry
  - candidate_validation_registry
  - world_state_ready_registry
  expected_outputs:
  - metrics.json
  - run_metadata.json
  - artifact_hashes.json
  - status.json
  - artifact_manifest.json
  metrics:
  - auroc
  - auprc
  - macro_f1
  - tri_consistency
  seeds:
  - 40
  - 41
  - 42
  - 43
  - 44
  resource_profile: gpu_train
  postrun_checks:
  - Libs/scripts/validators/validate_paper_grade_full_suite.py --mode postrun
  claim_guardrails:
  - preserve_ad_only_scope
  - preserve_G2_pass_with_warnings
  - preserve_G5_not_passed
  - no_general_drug_screening_claim
  - no_direct_clinical_endpoint_prediction_claim
  - no_private_clinical_data_training_claim
  - no_secondary_disease_readiness_claim
  status: ready
