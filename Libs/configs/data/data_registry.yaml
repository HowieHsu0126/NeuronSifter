spatial_atlas_registry:
  local_root: Input/processed
  output_root: Input/processed/spatial_atlas/public_ad_meso
  regions:
  - region_id: systemic_circulation
    region_label: Systemic Circulation
    region_role: systemic
    atlas_source: screening_config
    source_region_id: SYSTEMIC
    note: systemic proxy region for plasma and peripheral exposure
  - region_id: middle_temporal_gyrus
    region_label: Middle Temporal Gyrus
    region_role: cortical_observation
    atlas_source: ALLEN_ABC
    source_region_id: MTG
    note: temporal cortical observation region
  - region_id: entorhinal_cortex
    region_label: Entorhinal Cortex
    region_role: cortical_gateway
    atlas_source: screening_config
    source_region_id: EC
    note: cortico-limbic gateway region
  - region_id: hippocampus_ca1
    region_label: Hippocampus CA1
    region_role: hippocampal_response
    atlas_source: screening_config
    source_region_id: CA1
    note: hippocampal response region
  - region_id: hippocampus_ca3
    region_label: Hippocampus CA3
    region_role: hippocampal_transfer
    atlas_source: screening_config
    source_region_id: CA3
    note: hippocampal transfer region
  - region_id: prefrontal_cortex
    region_label: Prefrontal Cortex
    region_role: executive_cortex
    atlas_source: screening_config
    source_region_id: PFC
    note: frontal executive vulnerability region
  region_edges:
  - source_region_id: systemic_circulation
    target_region_id: middle_temporal_gyrus
    edge_type: vascular_exchange
    transport_scale: 0.95
    note: systemic to temporal cortex transport corridor
  - source_region_id: systemic_circulation
    target_region_id: entorhinal_cortex
    edge_type: vascular_exchange
    transport_scale: 0.9
    note: systemic to entorhinal transport corridor
  - source_region_id: systemic_circulation
    target_region_id: hippocampus_ca1
    edge_type: vascular_exchange
    transport_scale: 0.88
    note: systemic to CA1 transport corridor
  - source_region_id: systemic_circulation
    target_region_id: hippocampus_ca3
    edge_type: vascular_exchange
    transport_scale: 0.82
    note: systemic to CA3 transport corridor
  - source_region_id: systemic_circulation
    target_region_id: prefrontal_cortex
    edge_type: vascular_exchange
    transport_scale: 0.9
    note: systemic to prefrontal transport corridor
  - source_region_id: entorhinal_cortex
    target_region_id: hippocampus_ca1
    edge_type: cortico_limbic_relay
    transport_scale: 0.76
    note: entorhinal to CA1 relay
  - source_region_id: hippocampus_ca3
    target_region_id: hippocampus_ca1
    edge_type: hippocampal_relay
    transport_scale: 0.84
    note: CA3 to CA1 synaptic relay proxy
  - source_region_id: middle_temporal_gyrus
    target_region_id: entorhinal_cortex
    edge_type: cortical_association
    transport_scale: 0.58
    note: cortical association corridor
  - source_region_id: middle_temporal_gyrus
    target_region_id: prefrontal_cortex
    edge_type: cortical_association
    transport_scale: 0.52
    note: temporal to prefrontal association corridor
  observation_mappings:
  - modality: transcriptomics
    tissue_keyword: temporal
    observed_region_id: middle_temporal_gyrus
    observed_compartment_id: isf
    aggregation_rule: region_mean
    note: transcriptomic cortex samples map to MTG ISF
  - modality: transcriptomics
    tissue_keyword: entorhinal
    observed_region_id: entorhinal_cortex
    observed_compartment_id: isf
    aggregation_rule: region_mean
    note: entorhinal transcriptomics map to entorhinal ISF
  - modality: transcriptomics
    tissue_keyword: hippocampus
    observed_region_id: hippocampus_ca1
    observed_compartment_id: isf
    aggregation_rule: region_mean
    note: transcriptomic hippocampal samples map to CA1 ISF
  - modality: transcriptomics
    tissue_keyword: prefrontal
    observed_region_id: prefrontal_cortex
    observed_compartment_id: isf
    aggregation_rule: region_mean
    note: prefrontal transcriptomics map to prefrontal ISF
  - modality: transcriptomics
    tissue_keyword: frontal
    observed_region_id: prefrontal_cortex
    observed_compartment_id: isf
    aggregation_rule: region_mean
    note: frontal transcriptomics map to prefrontal ISF
  - modality: metabolomics
    tissue_keyword: blood
    observed_region_id: systemic_circulation
    observed_compartment_id: plasma
    aggregation_rule: region_mean
    note: blood metabolomics map to systemic plasma
  - modality: metabolomics
    tissue_keyword: serum
    observed_region_id: systemic_circulation
    observed_compartment_id: plasma
    aggregation_rule: region_mean
    note: serum metabolomics map to systemic plasma
  - modality: metabolomics
    tissue_keyword: plasma
    observed_region_id: systemic_circulation
    observed_compartment_id: plasma
    aggregation_rule: region_mean
    note: plasma metabolomics map to systemic plasma
  - modality: metabolomics
    tissue_keyword: whole blood
    observed_region_id: systemic_circulation
    observed_compartment_id: plasma
    aggregation_rule: region_mean
    note: whole blood metabolomics map to systemic plasma
  - modality: metabolomics
    tissue_keyword: csf
    observed_region_id: entorhinal_cortex
    observed_compartment_id: csf
    aggregation_rule: region_mean
    note: CSF metabolomics map to entorhinal CSF proxy
  relative_paths:
    region_catalog: spatial_atlas/public_ad_meso/region_catalog.tsv
    region_edge_catalog: spatial_atlas/public_ad_meso/region_edge_catalog.tsv
    region_compartment_catalog: spatial_atlas/public_ad_meso/region_compartment_catalog.tsv
    observation_mapping_catalog: spatial_atlas/public_ad_meso/observation_mapping_catalog.tsv
