  track_id: agent_twin_coevolution_wp2_precondition_closure
  mode: development_only
  execution_evidence_class: fixture_rehearsal_only
  output_root: Output/outputs/iclr2027/agent_twin_coevolution/wp2
  wp1_evidence:
    candidate_commit: 6d2a7b2dda370dbaddfba4abef701978b6c36692
