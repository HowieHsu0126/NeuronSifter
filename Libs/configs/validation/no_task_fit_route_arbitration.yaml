rubric:
  - criterion_id: provenance_license_clarity
    mandatory: true
    description: Provenance and license or access terms are explicit and bound for every required asset.
  - criterion_id: complete_method_identity
    mandatory: true
    description: Checkpoint, parameter, equation, prior, solver, and implementation identities required by the route are complete.
  - criterion_id: no_task_fit_feasibility
    mandatory: true
    description: The route requires no training, calibration, adapter fitting, target-task outcome, or post-hoc selection.
  - criterion_id: interface_compatibility
    mandatory: true
    description: Inputs and outputs are explicitly compatible with the future no-task-fit structured-action interface.
  - criterion_id: modality_control_coverage
    mandatory: true
    description: Supported intervention modalities and controls are explicit, with unsupported cases failing closed.
  - criterion_id: deterministic_or_seed_controlled_execution
    mandatory: true
    description: Execution is deterministic or governed by an explicit immutable seed policy.
  - criterion_id: uncertainty_semantics
    mandatory: true
    description: Native uncertainty or a scientifically explicit no-fit uncertainty hook is identified.
  - criterion_id: execution_resource_feasibility
    mandatory: true
    description: CPU execution is established or a strictly necessary inference-only GPU requirement is explicit.
  - criterion_id: scientific_limitations_bound
    mandatory: true
    description: Scientific limitations and prohibited claims are explicit and preserved.

disposition_rules:
  allowed_results:
    - satisfied
    - unsatisfied
    - not_applicable
  allowed_dispositions:
    - admissible
    - inadmissible
    - not_available
  admissible_rule: availability_state_available_and_every_mandatory_criterion_satisfied
  inadmissible_rule: availability_state_available_and_any_mandatory_criterion_not_satisfied
  not_available_rule: required_identity_or_asset_chain_absent
  candidate_projection: all_and_only_admissible_routes
  empty_registry_terminal: NO_ADMISSIBLE_NO_TASK_FIT_TWIN_ROUTE
  forbidden_field_names:
    - metric
    - metrics
    - score
    - rank
    - ranking
    - weight
    - weights
    - winner
    - preferred
    - preferred_route
    - default_route
    - efficacy
    - evaluation_result
    - inference_result
    - prediction

access_boundary:
  six_context_outcome_access: 0
  protected_holdout_access: 0
  new_intake_performed: false
  task_specific_fitting_performed: false
  simulator_execution_performed: false
  candidate_inference_performed: false
  six_context_files_opened: false
