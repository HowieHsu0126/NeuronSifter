    publication_date_to: "2026-08-27"
    max_queries: 6
    max_ids_per_query: 25
    metadata_record_cap: 150
    sort: relevance
    queries:
      - query_uid: disease_ipsc_compound_screen
        query: '(("Neurodegenerative Diseases"[MeSH Terms] OR "Alzheimer Disease"[MeSH Terms] OR "Parkinson Disease"[MeSH Terms] OR "Amyotrophic Lateral Sclerosis"[MeSH Terms] OR "Huntington Disease"[MeSH Terms] OR "Rett Syndrome"[MeSH Terms]) AND "Induced Pluripotent Stem Cells"[MeSH Terms] AND ("Drug Screening Assays"[MeSH Terms] OR "High-Throughput Screening Assays"[MeSH Terms]) AND "Journal Article"[Publication Type]) NOT (Review[Publication Type] OR Comment[Publication Type] OR Editorial[Publication Type] OR Clinical Trial[Publication Type] OR Meta-Analysis[Publication Type]) AND ("2015/01/01"[Date - Publication] : "2026/08/27"[Date - Publication])'
      - query_uid: disease_organoid_compound_screen
        query: '(("Neurodegenerative Diseases"[MeSH Terms] OR "Alzheimer Disease"[MeSH Terms] OR "Parkinson Disease"[MeSH Terms] OR "Amyotrophic Lateral Sclerosis"[MeSH Terms]) AND "Organoids"[MeSH Terms] AND ("Drug Screening Assays"[MeSH Terms] OR "Dose-Response Relationship, Drug"[MeSH Terms]) AND "Journal Article"[Publication Type]) NOT (Review[Publication Type] OR Comment[Publication Type] OR Editorial[Publication Type] OR Clinical Trial[Publication Type] OR Meta-Analysis[Publication Type]) AND ("2015/01/01"[Date - Publication] : "2026/08/27"[Date - Publication])'
      - query_uid: disease_neurite_intervention_comparison
        query: '(((Alzheimer*[Title] OR Parkinson*[Title] OR amyotrophic[Title] OR ALS[Title] OR Huntington*[Title] OR Rett[Title] OR neurodegener*[Title] OR "spinal cord injury"[Title] OR "brain injury"[Title]) AND (neurite[Title] OR axon[Title] OR dendrite[Title] OR morphology[Title]) AND (drug[Title] OR compound[Title] OR treatment[Title] OR therapy[Title]) AND (versus[Title] OR comparison[Title] OR combination[Title] OR monotherapy[Title] OR "dose-response"[Title] OR screening[Title])) AND "Journal Article"[Publication Type]) NOT (Review[Publication Type] OR Comment[Publication Type] OR Editorial[Publication Type] OR Clinical Trial[Publication Type] OR Meta-Analysis[Publication Type]) AND ("2015/01/01"[Date - Publication] : "2026/08/27"[Date - Publication])'
      - query_uid: disease_neural_activity_intervention_comparison
        query: '(((Alzheimer*[Title] OR Parkinson*[Title] OR amyotrophic[Title] OR ALS[Title] OR Huntington*[Title] OR Rett[Title] OR epilepsy[Title] OR neurodegener*[Title]) AND (electrophysiology[Title] OR excitability[Title] OR calcium[Title] OR synaptic[Title] OR "network activity"[Title]) AND (drug[Title] OR compound[Title] OR medication[Title] OR treatment[Title] OR therapy[Title]) AND (versus[Title] OR comparison[Title] OR combination[Title] OR monotherapy[Title] OR "dose-response"[Title] OR screening[Title])) AND "Journal Article"[Publication Type]) NOT (Review[Publication Type] OR Comment[Publication Type] OR Editorial[Publication Type] OR Clinical Trial[Publication Type] OR Meta-Analysis[Publication Type]) AND ("2015/01/01"[Date - Publication] : "2026/08/27"[Date - Publication])'
      - query_uid: neurodegeneration_combination_monotherapy
        query: '(((Alzheimer*[Title] OR Parkinson*[Title] OR amyotrophic[Title] OR ALS[Title] OR Huntington*[Title] OR Rett[Title] OR frontotemporal[Title] OR neurodegener*[Title]) AND (combination[Title] OR monotherapy[Title] OR versus[Title]) AND (drug[Title] OR compound[Title] OR medication[Title] OR treatment[Title] OR therapy[Title])) AND "Journal Article"[Publication Type]) NOT (Review[Publication Type] OR Comment[Publication Type] OR Editorial[Publication Type] OR Clinical Trial[Publication Type] OR Meta-Analysis[Publication Type]) AND ("2015/01/01"[Date - Publication] : "2026/08/27"[Date - Publication])'
      - query_uid: cns_injury_therapeutic_screen
        query: '(("Spinal Cord Injuries"[MeSH Terms] OR "Brain Injuries"[MeSH Terms] OR "Peripheral Nerve Injuries"[MeSH Terms]) AND ("Drug Screening Assays"[MeSH Terms] OR "Dose-Response Relationship, Drug"[MeSH Terms]) AND ("Neurons"[MeSH Terms] OR neurite[Title] OR axon[Title] OR survival[Title]) AND "Journal Article"[Publication Type]) NOT (Review[Publication Type] OR Comment[Publication Type] OR Editorial[Publication Type] OR Clinical Trial[Publication Type] OR Meta-Analysis[Publication Type]) AND ("2015/01/01"[Date - Publication] : "2026/08/27"[Date - Publication])'
  selection_policy:
    source_policy: primary_public_experimental_only
    public_access_requirement: pmc_link_required
    required_publication_type: Journal Article
    excluded_publication_types: [Review, Comment, Editorial, Letter, News, Meta-Analysis]
    excluded_doi_prefixes: [10.3390/]
    minimum_named_intervention_entities: 2
    disease_or_injury_context_required: true
    cns_model_or_endpoint_required: true
    shared_control_expected: true
    biological_replication_or_uncertainty_expected: true
    required_design_signals:
      - direct_head_to_head
      - combination_vs_monotherapy
      - dose_response
      - multi_arm_screen
    objective_uids:
      electrophysiology: functional_electrophysiology_rescue_v1
      calcium_activity: functional_calcium_activity_rescue_v1
      cell_viability_survival: functional_cell_viability_rescue_v1
      neurite_morphology: functional_neurite_morphology_rescue_v1
      synaptic_phenotype: functional_synaptic_phenotype_rescue_v1
      quantitative_pathology_phenotype: functional_pathology_phenotype_rescue_v1
    outcome_bearing_title_terms:
      - significant
      - winner
      - strongest
      - improve
      - mitigate
      - rescue
      - benefit
      - protect
      - increase
      - decrease
      - enhance
      - reduce
      - restore
      - attenuate
      - efficacy
      - promote
      - inhibit
      - facilitate
      - prevent
      - ameliorate
      - reverse
    non_original_or_non_interventional_title_terms:
      - protocol
      - methods
      - methodological
      - diagnostic
      - biomarker
      - classification
      - association
      - cohort
      - case report
      - systematic review
      - meta-analysis
    ranking_order:
      - named_intervention_entity_count
      - design_signal_priority
      - independent_context_diversity
      - query_support_count
      - public_source_completeness
      - publication_date_recency
      - publication_uid
