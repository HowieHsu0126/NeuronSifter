$schema: https://json-schema.org/draft/2020-12/schema
$id: controlled_world_qualification_report.schema.yaml
title: Controlled World Qualification Report
type: object
required: [schema_version, qualification_uid, terminal_decision, allowed_terminals, evidence_class, decision_basis, blockers, statistics, failure_records, undefined_cases, access_counters, claim_boundary]
properties:
  schema_version: {const: neuronsifter-controlled-world-qualification-report-v1}
  qualification_uid: {type: string}
  terminal_decision: {enum: [CONTROLLED_NEURAL_WORLD_BENCHMARK_QUALIFIED, CONTROLLED_NEURAL_WORLD_BENCHMARK_NOT_QUALIFIED]}
  allowed_terminals: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
  evidence_class: {const: controlled_world_non_empirical}
  decision_basis: {type: string}
  blockers: {type: array, items: {type: object}}
  statistics: {type: object}
  failure_records: {type: array}
  undefined_cases: {type: array}
  access_counters: {$ref: '#/$defs/access'}
  claim_boundary: {type: object}
additionalProperties: false
$defs:
  access:
    type: object
    required: [six_context_outcome_access, protected_holdout_access, test_outcome_access]
    properties:
      six_context_outcome_access: {const: 0}
      protected_holdout_access: {const: 0}
      test_outcome_access: {const: 0}
    additionalProperties: false
