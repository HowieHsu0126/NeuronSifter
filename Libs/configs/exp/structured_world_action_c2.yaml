structured_world_action_c2:
  contract_version: neuronsifter-c2-structured-world-action-v1
  selected_state_corpus:
    corpus_uid: public_foundation_corpus_rescue
    identity_hash: 3c9899d1704ce262801229d98fb5402f49159fb8959295d3b86600522b4ab7f1
    evidence_bundle_path: Output/audits/public_foundation_corpus_rescue_evidence_bundle.json
    evidence_validation_path: Output/audits/public_foundation_corpus_rescue_evidence_validation.json
    observation_blocks_path: Output/audits/public_foundation_corpus_rescue_canonical_observation_blocks.json
    state_encoder_role: canonical_state_representation_only
    foundation_transfer_claim_allowed: false
  immutable_foundation_corpora:
    - corpus_uid: public_foundation_corpus_v1
      identity_hash: 06ae88daf3c44be2c2bb96e51c939554e160b205138ec96f471adb5d82eee791
      evidence_bundle_path: Output/audits/public_foundation_corpus_evidence_bundle.json
      evidence_validation_path: Output/audits/public_foundation_corpus_evidence_validation.json
    - corpus_uid: public_foundation_corpus_rescue
      identity_hash: 3c9899d1704ce262801229d98fb5402f49159fb8959295d3b86600522b4ab7f1
      evidence_bundle_path: Output/audits/public_foundation_corpus_rescue_evidence_bundle.json
      evidence_validation_path: Output/audits/public_foundation_corpus_rescue_evidence_validation.json
  inputs:
    trajectory_numeric_lineage_path: Output/audits/trajectory_numeric_lineage_audit.json
    trajectory_qc_catalog_path: Input/processed/simulation_audit/simulation_qc_catalog.tsv
    trajectory_split_leakage_path: Input/processed/simulation_audit/simulation_split_leakage_audit.json
    mesoscopic_catalog_path: Input/processed/dynamics_ready/public_ad_meso/simulation_catalog.tsv
    full_teacher_catalog_path: Input/processed/full_microenvironment_teacher_ready/full_microenvironment_teacher_catalog.tsv
    simulation_teacher_catalog_path: Input/processed/simulation_teacher_ready/simulation_teacher_catalog.tsv
    regimen_catalog_path: Input/processed/action_ready/regimen_catalog.tsv
    drug_program_catalog_path: Input/processed/action_ready/drug_program_catalog.tsv
    compound_pk_prior_catalog_path: Input/processed/pkpd_ready/compound_pk_prior_catalog.tsv
    route_catalog_path: Input/processed/pkpd_ready/route_catalog.tsv
    schedule_catalog_path: Input/processed/pkpd_ready/schedule_catalog.tsv
    dose_catalog_path: Input/processed/pkpd_ready/dose_grid_catalog.tsv
  action_contract:
    required_fields:
      - action_uid
      - intervention_type
      - agent_set
      - target_set
      - dose_value
      - dose_unit
      - schedule
      - duration
      - route
      - cell_or_tissue_context
      - disease_state_scope
      - exposure_program_ref
      - occupancy_program_ref
      - off_target_context
      - publication_accession
      - assay_series_uid
      - evidence_quality
    require_physical_dose: true
    require_schedule_semantics: true
    permit_bootstrap_prior_as_observed_provenance: false
    action_uid_must_not_encode_split_role: true
  reachability_contract:
    required_action_holdout_families:
      - regimen_holdout
      - route_holdout
      - target_program_holdout
    required_trajectory_holdout_families:
      - trajectory_family_holdout
      - simulator_family_holdout
    strict_headline_requirements:
      - physical_action_semantics
      - frozen_c2_action_holdout_manifest
      - frozen_c2_trajectory_holdout_manifest
      - independent_simulator_family_or_trajectory_family
      - compatible_action_baselines
  statistics:
    bootstrap:
      method: paired
      resamples: 2000
      seed: 3407
      confidence_level: 0.95
    headline_seed_count: 5
    bootstrap_units:
      - action_program
      - independent_trajectory_family
      - simulator_family
      - biological_condition
      - source_publication_group
  baseline_registry:
    action_ablations:
      - A0_drug_id
      - A1_target_id
      - A2_regimen_token
      - A3_scalar_exposure
      - A4_occupancy_exposure_program
      - A5_full_structured_action
      - A6_full_structured_action_residual_context
    world_action_models:
      - B0_persistence
      - B1_linear_or_shallow_dynamics
      - B2_deterministic_neuronsifter
      - B3_stochastic_neuronsifter
      - B4_fno_or_deeponet
      - B5_transolver
      - B6_diffusionpde
      - B7_wdno
      - B8_biological_perturbation_baseline
  execution:
    job_name_prefix: NrnSift_C2_
    headline_submission_requires: c2_headline_reachable
    allow_c1_headline_submission: false
    allow_c2_headline_submission: false
  outputs:
    audit_root: Output/audits
    report_root: Output/paper_reports
