        const: OPERATIONAL_TWIN_TRAINING_EVIDENCE_INVALID
      scientific_twin_result:
        const: NOT_RUN
      sufficient_training:
        const: false
      continuation_authorized:
        const: false
      presealed_freeze_created:
        const: false
      audit_path:
        const: Output/audits/operational_twin_sufficient_training_audit.json
      historical_candidate_recovery_allowed:
        const: false
      historical_candidate_relabel_allowed:
        const: false
    additionalProperties: false
  sealed_manifest_metadata:
    type: object
    required:
    - metadata_source
    - complete_test_manifest_git_blob
    - freeze_uid
    - test_manifest_uid
    - test_content_identity
    - first_use_policy
    - sealed_content_opened
    properties:
      metadata_source:
        const: Libs/configs/data/controlled_world_open_action_identification.yaml
      complete_test_manifest_git_blob:
        const: 674c793eb70bc25bf4231fae15e7a8c932272436
      freeze_uid:
        const: controlled_world_benchmark_freeze_0281a803b2e6bd6ec95cb4ef
      test_manifest_uid:
        const: controlled_world_benchmark_manifest_b576c61c51961c1c41d6439d
      test_content_identity:
        const: 854350ccada4e2fdf3ef56417be57ef9d787aed8f4e3a1ddd2645d2131c2743b
      first_use_policy:
        const: first_and_only_use
      sealed_content_opened:
        const: false
    additionalProperties: false
  scheduler_evidence_contract:
    type: object
    required:
    - contract_version
    - amendment_date
    - slurm_version
    - field_mapping
    - forbidden_legacy_fields
    - accepted_oversubscribe
    - gpu_tres_per_node
    - retained_fixtures
    - historical_incompatibility_job_id
    - positive_terminal
    - negative_terminal
    - dispatch_authorized
    properties:
      contract_version:
        const: slurm-22.05.9-execution-interface-v3
      amendment_date:
        const: '2026-09-12'
      slurm_version:
        const: 22.05.9
      field_mapping:
        const:
          resource_query_job_id: derived(SLURM_ARRAY_JOB_ID,SLURM_ARRAY_TASK_ID,SLURM_JOB_ID)
          scontrol_job_id: JobId
          scontrol_array_job_id: ArrayJobId
          scontrol_array_task_id: ArrayTaskId
          partition: Partition
          nodelist: NodeList
          cpus_per_task: CPUs/Task
          tres_cpu: TRES.cpu
          memory: MinMemoryNode
          oversubscribe: OverSubscribe
          gpu_gres_per_node: TresPerNode
      forbidden_legacy_fields:
        const:
        - ReqTRES
        - AllocTRES
        - Shared
      accepted_oversubscribe:
        const: OK
      gpu_tres_per_node:
        const: gres:gpu:1
      retained_fixtures:
        const:
          cpu_light:
            source_job_id: '545144'
            path: Libs/tests/fixtures/operational_twin_resource_receipts/cpu04_job_545144.json
          gpu_single:
            source_job_id: '545150'
            path: Libs/tests/fixtures/operational_twin_resource_receipts/gpu03_job_545150.json
          array_element_resource:
            source_job_id: '547789'
            path: Libs/tests/fixtures/operational_twin_resource_receipts/slurm_array_element_resource_receipt.json
          array_terminal_accounting:
            source_job_id: '547789'
            path: Libs/tests/fixtures/operational_twin_resource_receipts/slurm_array_terminal_accounting_receipt.json
      historical_incompatibility_job_id:
        const: '545215'
      positive_terminal:
        const: OPERATIONAL_TWIN_CANDIDATE_EXECUTION_INTERFACES_REPAIRED
      negative_terminal:
        const: OPERATIONAL_TWIN_CANDIDATE_EXECUTION_INTERFACES_NOT_REPAIRED
      dispatch_authorized:
        const: false
    additionalProperties: false
  supersession_contract:
    type: object
  execution_authority_contract:
    authority_schema_version: neuronsifter-operational-twin-candidate-execution-authority-v3
    resource_receipt_schema_version: neuronsifter-operational-twin-candidate-resource-environment-receipt-v3
    authority_role: operational_twin_candidate_execution
    positive_authority_terminal: OPERATIONAL_TWIN_CANDIDATE_EXECUTION_AUTHORIZED
    positive_resource_receipt_terminal: OPERATIONAL_TWIN_CANDIDATE_RESOURCE_ENVIRONMENT_RECEIPT_VALID
    approved_protocol_review_path: orchestrator/rounds/round-47-repair-operational-twin-candidate-execution-interfaces/review-record.json
    required_review_schema_version: review-record-v4
    required_review_round_id: round-47-repair-operational-twin-candidate-execution-interfaces
    required_review_direction_id: repair-operational-twin-candidate-execution-interfaces
    required_review_decision: approved
    scheduler_evidence_contract_version: slurm-22.05.9-execution-interface-v3
    candidate_execution_authority_path_template: Output/audits/operational_twin/candidate_execution_authorities/{candidate_lineage_uid}/{assignment_uid}/{attempt_uid}.json
    resource_environment_receipt_path_template: Output/audits/operational_twin/candidate_resource_environment_receipts/{candidate_lineage_uid}/{assignment_uid}/{attempt_uid}.json
    fresh_sinfo_command:
    - sinfo
    - --noheader
    - --nodes={nodelist}
    - --format=%N|%P|%T|%G
    fresh_resource_command:
    - scontrol
    - --oneliner
    - show
    - job
    - '{resource_query_job_id}'
    maximum_resource_receipt_age_seconds: 1800
    independent_execution_authority_required_before_dispatch: true
    resource_environment_receipt_required_before_dispatch: true
    approved_review_binding_required: true
    source_commit_binding_required: true
    source_identity_binding_required: true
    assignment_binding_required: true
    attempt_binding_required: true
    exact_placement_required: true
    cpu_memory_gres_exclusivity_evidence_required: true
    terminal_provenance_binding_required: true
    authority_bound_in_this_round: false
    resource_receipt_bound_in_this_round: false
  execution_contract:
    type: object
    required:
    - attempt_slots
    - maximum_attempts_per_assignment
    - maximum_infrastructure_recovery_attempts_per_assignment
    - recovery_same_assignment_only
    - recovery_uses_fresh_random_initialization
    - recovery_consumes_predecessor_state
    - learning_rate_schedule
    - outcome_driven_budget_extension_allowed
    - outcome_driven_learning_rate_extension_allowed
    - runtime_budget_override_allowed
    - full_budget_stopping_rule
    - convergence_rule
    - checkpoint_selection_role
    - best_checkpoint_required_for_trainable
    - last_checkpoint_required_for_trainable
    - best_and_last_must_be_distinct_paths
    - calibration_rule
    - atomic_attempt_claim
    - overwrite_allowed
    - failure_retention
    - fresh_sinfo_before_execution_round
    - new_resource_environment_receipt_before_dispatch
    - resource_receipt_bound_in_this_round
    - profiles
    - wall_time_by_method
    properties:
      attempt_slots:
        type: array
        prefixItems:
        - type: object
          required:
          - attempt_kind
          - attempt_ordinal
          - conditional
          - eligible_after_failure_class
          properties:
            attempt_kind:
              const: initial
            attempt_ordinal:
              const: 1
            conditional:
              const: false
            eligible_after_failure_class:
              const: null
          additionalProperties: false
        - type: object
          required:
          - attempt_kind
          - attempt_ordinal
          - conditional
          - eligible_after_failure_class
          properties:
            attempt_kind:
              const: infrastructure_recovery_01
            attempt_ordinal:
              const: 2
            conditional:
              const: true
            eligible_after_failure_class:
              const: infrastructure_interruption
          additionalProperties: false
        items: false
        minItems: 2
        maxItems: 2
      maximum_attempts_per_assignment:
        const: 2
      maximum_infrastructure_recovery_attempts_per_assignment:
        const: 1
      recovery_same_assignment_only:
        const: true
      recovery_uses_fresh_random_initialization:
        const: true
      recovery_consumes_predecessor_state:
        const: false
      learning_rate_schedule:
        const: constant
      outcome_driven_budget_extension_allowed:
        const: false
      outcome_driven_learning_rate_extension_allowed:
        const: false
      runtime_budget_override_allowed:
        const: false
      full_budget_stopping_rule:
        const: complete_configured_epochs_or_max_steps_without_outcome_driven_extension
      convergence_rule:
        const: independent_post_execution_adjudication_required
      checkpoint_selection_role:
        const: development_only
      best_checkpoint_required_for_trainable:
        const: true
      last_checkpoint_required_for_trainable:
        const: true
      best_and_last_must_be_distinct_paths:
        const: true
      calibration_rule:
        const: eligible_uq_method_only_on_calibration_worlds_after_restoring_best_development_state
      atomic_attempt_claim:
        const: true
      overwrite_allowed:
        const: false
      failure_retention:
        const: retain_every_attempt_failure_and_undefined_result
      fresh_sinfo_before_execution_round:
        const: true
      new_resource_environment_receipt_before_dispatch:
        const: true
      resource_receipt_bound_in_this_round:
        const: false
      profiles:
        type: object
        required:
        - cpu_light
        - gpu_single
        properties:
          cpu_light:
            type: object
            required:
            - partition
            - nodelist
            - cpus_per_task
            - memory
            - gres
            - exclusive
            properties:
              partition:
                const: cpu
              nodelist:
                const: cpu04
              cpus_per_task:
                const: 2
              memory:
                const: 8G
              gres:
                const: null
              exclusive:
                const: false
            additionalProperties: false
          gpu_single:
            type: object
            required:
            - partition
            - nodelist
            - cpus_per_task
            - memory
            - gres
            - exclusive
            properties:
              partition:
                const: gpu1
              nodelist:
                const: gpu03
              cpus_per_task:
                const: 6
              memory:
                const: 32G
              gres:
                const: gpu:1
              exclusive:
                const: false
            additionalProperties: false
        additionalProperties: false
      wall_time_by_method:
        type: object
        required:
        - persistence_no_action
        - linear_or_delta
        - same_backbone_no_action
        - deterministic_action_conditioned
        - full_uncertainty_aware_action_conditioned
        properties:
          persistence_no_action:
            const: '00:20:00'
          linear_or_delta:
            const: '02:00:00'
          same_backbone_no_action:
            const: '06:00:00'
          deterministic_action_conditioned:
            const: '08:00:00'
          full_uncertainty_aware_action_conditioned:
            const: '12:00:00'
        additionalProperties: false
    additionalProperties: false
