  maximum_scale: 1000000.0
  source_partition_role: validation
  calibration_role: tri_calibration
  evaluation_role: static_loop_evaluation
  allow_test_derived_threshold_change: false

static_policy:
  canonical_policy_uid: S_shared_belief_decision_risk
  controls:
    - R_random_information_action
    - F_fixed_cascade
    - U_uncertainty_only
    - S_shared_belief_decision_risk
  seed: 3407
  information_budget_per_round: 1
  sequential_rounds: 3
  query_without_replacement: true
  top_k: 2
  expected_cost_floor: 0.000001
  fixed_cascade_order:
    - static_query_positive_long
    - static_query_negative_long
    - static_query_positive_mid
    - static_query_negative_mid
    - static_query_positive_short
    - static_query_negative_short
    - static_query_positive_brief
    - static_query_negative_brief

