paper_experiments:
  publication_disease_programs:
  - ad_control
  - pd_control
  ad_case_study:
    evidence_scope: Alzheimer disease only
    curated_target_evidence:
    - target_symbol: APP
      evidence_label: amyloid precursor processing is central to AD pathology
      source_url: https://www.ncbi.nlm.nih.gov/gene/351
    - target_symbol: BACE1
      evidence_label: beta-secretase inhibition is a canonical AD therapeutic axis
      source_url: https://www.ncbi.nlm.nih.gov/gene/23621
    - target_symbol: MAPK14
      evidence_label: p38 MAP kinase signaling is repeatedly implicated in neuroinflammation
        and AD stress response
      source_url: https://www.ncbi.nlm.nih.gov/gene/1432
    - target_symbol: GSK3A
      evidence_label: glycogen synthase kinase signaling is linked to tau phosphorylation
        and AD biology
      source_url: https://www.ncbi.nlm.nih.gov/gene/2931
    - target_symbol: PTGS2
      evidence_label: inflammatory prostaglandin signaling has recurrent AD drug-repurposing
        support
      source_url: https://www.ncbi.nlm.nih.gov/gene/5743
  shared_latent_formal:
    base_config_path: Libs/configs/config_stack.yaml
    cluster:
      partition: gpu
      nodelist: cpu03
      cpus_per_task: 4
      mem: 24G
    runtime:
      device: cpu
      training_scope: all
      seed_values:
      - 3407
      - 42
      - 26
      benchmark_name_scope: benchmark_registry
      benchmark_name_template: ad_control_shared_latent_seed_{seed}
      result_catalog_template: benchmark_ready/seeded_results/ad_control_shared_latent_seed_{seed}.tsv
    config_overrides: {}
  ad_screening_system_formal_ad_control:
    base_config_path: Libs/configs/config_stack.yaml
    cluster:
      partition: gpu
      nodelist: cpu03
      cpus_per_task: 4
      mem: 24G
    runtime:
      device: cpu
      training_scope: all
      seed_values:
      - 3407
      - 42
      - 26
      benchmark_name_scope: screening_pipeline
      benchmark_name_template: ad_screening_system_ad_control_seed_{seed}
      artifact_root: Output/results/ad_screening_system_formal
    config_overrides:
      benchmark_registry:
        active_disease_program: ad_control
      screening_pipeline:
        action_ready_registry:
          forced_include_compounds: []
          forced_include_targets: []
        screening_benchmark:
          active_disease_program: ad_control
  ad_screening_without_atlas_prior:
    base_config_path: Libs/configs/config_stack.yaml
    cluster_prebuild:
      partition: gpu
      nodelist: cpu03
      cpus_per_task: 4
      mem: 48G
    cluster_training:
      partition: gpu1
      nodelist: gpu03
      cpus_per_task: 8
      mem: 48G
      gres: gpu:1
    runtime:
      device: cuda
      training_scope: all
      seed_values:
      - 3407
      - 42
      - 26
      benchmark_name_scope: screening_pipeline
      benchmark_name_template: ad_screening_system_public_ad_aging_without_atlas_seed_{seed}
      artifact_root: Output/results/dynamics_ablations
    config_overrides:
      benchmark_registry:
        active_disease_program: ad_control
      screening_pipeline:
        screening_benchmark:
          active_disease_program: ad_control
          component_switches:
            atlas_prior_consistency: false
            clue_signature_reversal: true
            drug_target_evidence_ranking: true
            pkpd_prior_consistency: true
            structural_prior: true
            local_response_heads: true
