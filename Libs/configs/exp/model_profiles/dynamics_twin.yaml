    - '{python_executable} -u Libs/scripts/validators/validate_structural_prior_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_spatial_atlas_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_spatial_atlas_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_dynamics_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_dynamics_ready_registry.py --config {config_path}'
