retrieval_policy:
  client_preference: biopython_entrez_when_contract_preserving
  selected_transport: bounded_exact_ncbi_http
  selected_transport_reason: biopython_entrez_does_not_expose_the_required_redirect_and_bounded_read_controls
  contact_email_source_order:
    - NEURONSIFTER_ENTREZ_EMAIL
    - git_config_user_email
  tool: NeuronSifter
  request_kind: pubmed_exact_fetch
  url_template: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id={pmid}&rettype=pubmed&retmode=xml&tool=NeuronSifter&email={encoded_email}
  allowed_hosts:
    - eutils.ncbi.nlm.nih.gov
    - www.ncbi.nlm.nih.gov
    - pmc.ncbi.nlm.nih.gov
  allowed_paths:
    - /entrez/eutils/efetch.fcgi
    - /entrez/eutils/elink.fcgi
  allowed_content_types:
    - application/xml
    - text/xml
  maximum_requests_per_slot: 3
  maximum_total_requests: 45
  concurrency: 1
  timeout_seconds: 30
  retries: 0
  minimum_request_interval_ms: 400
  maximum_response_bytes: 16777216
  maximum_total_response_bytes: 134217728
  maximum_redirects: 3
  raw_response_persistence_allowed: false
  response_value_logging_allowed: false

content_policy:
  parser_version: mechanism-content-projector-v1
  allowed_abstract_labels:
    - BACKGROUND
    - INTRODUCTION
    - OBJECTIVE
    - AIM
    - METHODS
    - LIMITATIONS
  denied_abstract_labels:
    - RESULTS
    - RESULT
    - CONCLUSIONS
    - CONCLUSION
    - FINDINGS
    - INTERPRETATION
    - DISCUSSION
  allowed_content_classes:
    - mechanism_definition
    - equation
    - variable_or_dependency_definition
    - parameter_value_or_range
    - unit_definition
    - explicit_assumption
    - explicit_limitation
    - measurement_definition
    - state_observable_link
    - support_boundary
  denied_content_classes:
    - efficacy
    - benefit
    - response
    - outcome
    - clinical_endpoint
    - effect_size
    - p_value
    - confidence_interval
    - ranking
    - recommendation
    - table
    - figure
    - caption
    - supplement
    - bibliography
    - citation_context
    - six_context_result_substitute
    - protected_holdout
  unstructured_abstract_disposition: forbidden_mixed_content

grading_policy:
  ordered_grades:
    - DIRECT_MECHANISM
    - PARAMETER_ANCHOR
    - BOUNDARY_CONSTRAINT
    - CONTEXT_ONLY
    - INADMISSIBLE
  support_grades:
    - DIRECT_MECHANISM
    - PARAMETER_ANCHOR
    - BOUNDARY_CONSTRAINT
  claim_types:
    - equation
    - causal_dependency
    - structural_dependency
    - parameter_range
    - unit_definition
    - assumption
    - limitation
    - measurement_definition
    - latent_to_observable_link
    - prior_role_support
    - support_boundary
  contradiction_resolution_dimensions:
    - scope
    - units
    - population_or_model_system
    - measurement_definition
    - assumption

decision_policy:
  qualified_terminal: MECHANISM_BASIS_QUALIFIED
  insufficient_terminal: MECHANISM_BASIS_INSUFFICIENT
  require_all_required_coverage: true
  require_no_unresolved_essential_contradiction: true
  numerical_prior_population_allowed: false

