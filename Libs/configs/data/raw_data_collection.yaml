          use agreement.
      - source_accession: OASIS-4
        asset_name: tabular_metadata
        required_artifact_pattern: '*metadata*.csv|*metadata*.tsv'
        description: OASIS-4 tabular metadata accepted after OASIS-3 approval and
          release access.
