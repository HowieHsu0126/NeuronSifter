    observable_flag: 'yes'
    note: insoluble Aβ plaque microenvironment field
  - species_id: phosphorylated_tau
    species_label: Phosphorylated Tau
    species_role: protein_pathology
    unit: relative_burden
    observable_flag: 'yes'
    note: tau phosphorylation and spread microenvironment field
  - species_id: inflammatory_mediator
