    drop_relative_dir: downloads/manual_drop
    manifest_relative_path: downloads/manual_drop_manifest.tsv
    checklist_relative_path: downloads/manual_completion_checklist.json
    resolved_status: resolved_manual_drop
  sources:
    oasis:
      requirements:
      - source_accession: OASIS-3
        asset_name: clinical_tables
        required_artifact_pattern: '*clinical*.csv|*clinical*.tsv'
        description: OASIS-3 clinical tabular exports accepted under the active data
          use agreement.
      - source_accession: OASIS-3
        asset_name: cognitive_tables
        required_artifact_pattern: '*cognitive*.csv|*cognitive*.tsv'
        description: OASIS-3 cognitive tabular exports accepted under the active data
          use agreement.
      - source_accession: OASIS-3
        asset_name: biomarker_tables
        required_artifact_pattern: '*biomarker*.csv|*biomarker*.tsv'
        description: OASIS-3 biomarker tabular exports accepted under the active data
          use agreement.
