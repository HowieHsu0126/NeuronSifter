    - '{python_executable} -u Libs/scripts/validators/validate_simulation_readiness_audit.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_supplemental_milestone_contracts.py --config {config_path} --output Output/audits/supplemental_milestone_contracts.json'
    - '{python_executable} -u Libs/scripts/validators/validate_mechanistic_teacher_runtime.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_counterfactual_benchmark_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_counterfactual_benchmark_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_feedback_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_feedback_ready_registry.py --config {config_path}'
  train_commands:
    - '{python_executable} -u Libs/exp/training/pretrain_microenvironment_world_model.py --config {config_path} --device {device}'
    - '{python_executable} -u Libs/exp/training/train_screening_system.py --config {config_path} --training-scope {training_scope} --device {device}'
    - '{python_executable} -u Libs/exp/evaluation/evaluate_screening_system.py --config {config_path}'
    - '{python_executable} -u Libs/exp/evaluation/evaluate_active_learning_replay.py --config {config_path}'
    - '{python_executable} -u Libs/exp/export/export_screening_bundle.py --config {config_path}'
