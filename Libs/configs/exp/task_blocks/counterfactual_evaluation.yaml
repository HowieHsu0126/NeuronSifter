task_block:
  task_id: counterfactual_evaluation
  task_name: counterfactual_evaluation
  task_family: intervention_counterfactual
  description: Paper-grade AD-only counterfactual_evaluation task block.
  shell_entrypoint: Libs/scripts/experiments/run_counterfactual_evaluation.sh
  shell_path: Libs/scripts/experiments/run_counterfactual_evaluation.sh
  python_entrypoint: Libs/exp/evaluation/evaluate_counterfactuals.py
  python_path: Libs/exp/evaluation/evaluate_counterfactuals.py
  config_requirements:
  - Libs/configs/config_stack.yaml
  - Libs/configs/exp/paper_grade_full_suite.yaml
  expected_inputs:
  - counterfactual_pair_registry
  - formal_result_catalogs
  expected_outputs:
  - metrics.json
  - run_metadata.json
  - artifact_hashes.json
  - status.json
  - artifact_manifest.json
  metrics:
  - direction_hit_rate
  - counterfactual_pair_accuracy
  - pkpd_consistency
  seeds:
  - 40
  - 41
  - 42
  - 43
  - 44
  resource_profile: cpu_large
  postrun_checks:
  - Libs/scripts/validators/validate_paper_grade_full_suite.py --mode postrun
  claim_guardrails:
  - preserve_ad_only_scope
  - preserve_G2_pass_with_warnings
  - preserve_G5_not_passed
  - no_general_drug_screening_claim
  - no_direct_clinical_endpoint_prediction_claim
  - no_private_clinical_data_training_claim
  - no_secondary_disease_readiness_claim
  status: ready
