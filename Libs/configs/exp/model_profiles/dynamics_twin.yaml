    - '{python_executable} -u Libs/scripts/builders/build_alignment_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_alignment_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_benchmark_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_benchmark_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_pkpd_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_pkpd_ready_registry.py --config {config_path}'
