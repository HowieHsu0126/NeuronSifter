  - Libs/exp/aggregation/aggregate_multiseed_results.py --dry-run
  - Libs/exp/aggregation/build_paper_grade_tables.py --dry-run
  - Libs/exp/aggregation/build_completion_audit.py --dry-run
  - Libs/scripts/validators/validate_paper_grade_full_suite.py --mode postrun
  entrypoint_registry:
    world_model_pretraining:
      shell_path: Libs/scripts/experiments/run_world_model_pretraining.sh
      python_path: Libs/exp/training/train_world_model_pretraining.py
      config_path: Libs/configs/exp/task_blocks/world_model_pretraining.yaml
