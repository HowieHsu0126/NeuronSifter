    stop_hours: 672.0
    step_count: 28
  chunk_size: 32
  parallel_workers: 8
  process_start_method: spawn
  contract_version: ad_full_microenvironment_v2
  ad_first_data_readiness:
    primary_disease_program: ad_control
    active_generation_stage: pilot
    condition_names:
    - control
    - ad_positive
    generation_stages:
      pilot:
        replicate_count: 4
        target_trajectory_count: 111168
        readiness_status: pilot_volume_ready_provisional_parameters
      final:
        replicate_count: 36
        target_trajectory_count: 1000512
        readiness_status: million_volume_ready_provisional_parameters
    heterogeneity_sampler:
      family: deterministic_stratified_uniform
      seed: 3407
      hash_algorithm: sha1
      route_source_multiplier_span: 0.15
      pathology_baseline_multiplier_span: 0.12
      production_rate_multiplier_span: 0.1
      clearance_multiplier_span: 0.1
      mechanism_strength_multiplier_span: 0.08
      minimum_multiplier: 0.75
      maximum_multiplier: 1.25
      shared_patient_multiplier_names:
      - pathology_baseline
      - production_rate
      - clearance
      regimen_conditioned_multiplier_names:
      - route_source
      - mechanism_strength
    parameter_evidence_policy:
      active_policy: temporary_acceptance_with_provisional_evidence
      evidence_status: provisional_parameter_evidence
      allow_bootstrap_config_parameters: true
      final_reporting_requirement: replace_or_cite_before_claiming_literature_supported
