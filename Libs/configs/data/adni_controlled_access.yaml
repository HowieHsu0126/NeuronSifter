adni_controlled_access:
  enabled: true
  source_key: adni_controlled_access
  benchmark_role: controlled_access_longitudinal_validation_state_inference_benchmark
  governance:
    access_boundary: controlled_access
    participant_level_policy: private_or_controlled_namespace_only
    public_release_policy: aggregate_summary_only
    publication_boundary: preserve_public_only_mainline
    data_use_agreement_required: true
    approved_application_scope_required: true
    raw_redistribution_allowed: false
    derived_participant_level_redistribution_allowed: false
    acknowledgement_policy_required: true
    evidence:
      governance_root: ADNI_access_governance
      required_documents:
      - document_id: adni_data_use_agreement
        relative_path: ADNI_data_use_agreement.pdf
        document_kind: data_use_agreement
        required: true
      - document_id: approved_application_scope
        relative_path: approved_application_scope.pdf
        document_kind: approved_scope
        required: true
      - document_id: approved_data_type_inventory
        relative_path: approved_data_type_inventory.tsv
        document_kind: approved_data_inventory
        required: true
      - document_id: storage_access_policy
        relative_path: storage_access_policy.md
        document_kind: storage_policy
        required: true
      - document_id: publication_acknowledgement_policy
        relative_path: publication_acknowledgement_policy.md
        document_kind: publication_policy
        required: true
      approved_scope_flags:
        ai_ml_modeling: true
        digital_twin_modeling: true
        disease_progression_modeling: true
        biomarker_modeling: true
        controlled_validation_calibration: true
      storage_policy:
        participant_level_namespace: Input/private/adni
        processed_private_namespace: Input/processed/adni
        public_namespace_policy: aggregate_summaries_only
        credential_storage_policy: environment_only_or_private_cookie_jar
      acknowledgement_publication_policy:
        acknowledgement_required: true
        administrative_review_required: true
        status: required_before_public_submission
  credentials:
    email_env: ADNI_IDA_EMAIL
    password_env: ADNI_IDA_PASSWORD
    hash_salt_env: ADNI_HASH_SALT
    logging_policy: aggregate_counts_only
  paths:
    private_root: Input/private/adni
    processed_root: Input/processed/adni
    raw_manifest: raw_manifest.tsv
    download_receipts: manifests/download_receipts.tsv
    checksum_table: manifests/checksums.tsv
    approved_asset_manifest: manifests/approved_assets.tsv
    missing_role_audit: manifests/missing_role_audit.json
    manifest_schema_audit: manifests/manifest_schema_audit.json
    collection_page_inventory: navigation/ida_collection_page_inventory.json
    collection_next_action_report: navigation/ida_collection_next_action_report.json
    planned_downloads: manifests/planned_downloads.tsv
    sample_observation_registry: adni_sample_observation_registry.tsv
    longitudinal_transition_table: adni_longitudinal_transition_table.tsv
    feature_matrix: adni_feature_matrix.parquet
    imaging_inventory: adni_imaging_inventory.tsv
    medication_exposure: adni_medication_exposure.tsv
    domain_inventory: adni_domain_inventory.tsv
    missingness_audit: adni_missingness_audit.json
    split_audit: adni_split_audit.json
    model_input_registry: adni_model_input_registry.json
    access_governance_report: adni_access_governance.json
    controlled_bundle_pointer: Output/paper_reports/adni_controlled_bundle_pointer.json
    sample_index: model_inputs/sample_index.parquet
    feature_index: model_inputs/feature_index.parquet
    matrix_raw: model_inputs/matrix_raw.npy
    matrix_norm: model_inputs/matrix_norm.npy
    matrix_missing_mask: model_inputs/matrix_missing_mask.npy
    train_scaler: model_inputs/train_only_scaler.json
    transition_label_index: model_inputs/transition_labels.parquet
    controlled_application_audit: adni_controlled_application_audit.json
    state_projection_report: model_outputs/adni_state_projection_report.json
    world_state_predictions: model_outputs/adni_world_state_predictions.parquet
    state_inference_summary: Output/paper_reports/adni_state_inference_summary.json
    longitudinal_validation_summary: Output/paper_reports/adni_longitudinal_validation_summary.json
    missing_modality_robustness: Output/paper_reports/adni_missing_modality_robustness.json
    world_state_factor_anchoring: Output/paper_reports/adni_world_state_factor_anchoring.json
    posterior_calibration_summary: Output/paper_reports/adni_posterior_calibration_summary.json
  acquisition:
    mode: collection_first
    manifest_path: Input/private/adni/manifests/ida_generated_manifest.tsv
    manifest_format: auto
    minimum_downloadable_records: 1
    direct_download_allowed: true
    identifier_request_dry_run_required: true
    allow_identifier_download_after_dry_run: false
    participant_data_download_root: downloads/manifest_assets
    filename_default_extension: bin
    identifier_download_request_templates:
      image_id: https://ida.loni.usc.edu/pages/access/download.jsp?imageId={identifier}
      file_id: https://ida.loni.usc.edu/pages/access/download.jsp?fileId={identifier}
      package_id: https://ida.loni.usc.edu/pages/access/download.jsp?packageId={identifier}
    manifest_first:
      generated_manifest_path: Input/private/adni/manifests/ida_generated_manifest.tsv
    collection_first:
      enabled: true
      project: ADNI
      execution_profile: build_manifest_only
      profiles:
        build_manifest_only:
          build_manifest_only: true
          download_enabled: false
          enforce_required_roles_on_download: true
          max_records: 512
        smoke_download:
          build_manifest_only: false
          download_enabled: true
          enforce_required_roles_on_download: false
          max_records: 1
        required_roles_download:
          build_manifest_only: false
          download_enabled: true
          enforce_required_roles_on_download: true
          max_records: 512
      browser_engine: auto
      headless: true
      playwright_launch_args:
      - --no-proxy-server
      proxy_environment_variables:
      - HTTP_PROXY
      - HTTPS_PROXY
      - http_proxy
      - https_proxy
      - ALL_PROXY
      - all_proxy
      playwright_debug_screenshot: navigation/ida_playwright_last_page.png
      target_collection_name: neuronsifter_adni_v0_smoke
      build_manifest_only: true
      download_enabled: false
      enforce_required_roles_on_download: true
      max_records: 512
      smoke_profile: clinical_or_metadata_first
      deny_raw_dicom_or_full_image: true
      denied_filename_patterns:
      - (?i)\.dcm$
      - (?i)\.dicom$
      - (?i)\.nii(\.gz)?$
      - (?i)\.img$
      - (?i)\.hdr$
      preferred_record_patterns:
      - (?i)clinical
      - (?i)metadata
      - (?i)study\s*data
      - (?i)ADNIMERGE
      denied_link_patterns:
      - (?i)support
      - (?i)privacy
      - (?i)contact
      - (?i)faq
      - (?i)login
      - (?i)logout
      denied_navigation_path_names:
      - search.jsp
      - support.jsp
      - login.jsp
      - index.jsp
      direct_download_path_patterns:
      - (?i)/download
      - (?i)/file
      direct_download_file_patterns:
      - (?i)\.(csv|tsv|json|xlsx?|zip|tar|gz|txt)(\?|$)
      arc_builder:
        enabled: true
        base_url: https://ida.loni.usc.edu
        get_searches_path: /ajax2/xml/search/getSearches_v2
        get_variables_path: /ajax2/xml/search/getVariables_v2
        download_tables_path: /ajax2/xml/search/downloadTables_v2
        get_study_categories_path: /ajax2/xml/search/getStudyCategories_v2
        get_study_data_path: /pages/ajax/getStudyData
        search_download_base_path: /download/files/search/
        study_download_base_path: /download/files/study/
        selected_search_name_patterns:
        - (?i)ADNI Recommended PET and MRI
        role_table_categories:
          visit_diagnosis:
          - DXSUM
          demographics:
          - PTDEMOG
          cognitive_scores:
          - NEUROBAT
          neuropsychiatric_scores:
          - NPIQ
          - NPI
          medications:
          - RECMHIST
          apoe_genetics:
          - APOERES
          mri_freesurfer:
          - UCSFFSX7
          t1_inventory:
          - MRI3META
          amyloid_pet:
          - UCBERKELEY_AMY_6MM
          tau_pet:
          - UCBERKELEY_TAU_6MM
          csf_biomarkers:
          - UPENNBIOMK_ROCHE_ELECSYS
          plasma_biomarkers:
          - UPENN_PLASMA_FUJIREBIO_QUANTERIX
          omics_inventory:
          - GENETIC
        role_study_file_patterns:
          adni_merge_core:
            type: table
            allow_archive: true
            item_name_patterns:
            - (?i)^ADNIMERGE - Key ADNI tables merged into one table \[ADNI1,GO,2,3\]$
          fdg_pet:
            type: table
            allow_archive: true
            item_name_patterns:
            - (?i)^UC Berkeley - FDG Analysis \[ADNI1,GO,2,3\]$
      navigation_targets:
      - target_key: project_landing
        url: https://ida.loni.usc.edu/login.jsp?project=ADNI
        target_kind: Project Landing
      - target_key: image_collections
        url: https://ida.loni.usc.edu/pages/access/search.jsp?page=DOWNLOADS&project=ADNI&subPage=IMAGE_COLLECTIONS&tab=collection
        target_kind: Image Collections
      - target_key: data_collections
        url: https://ida.loni.usc.edu/pages/access/search.jsp?page=DOWNLOADS&project=ADNI&subPage=DATA_COLLECTIONS&tab=collection
        target_kind: Data Collections
      - target_key: advanced_search
        url: https://ida.loni.usc.edu/explore/jsp/search_v2/search.jsp?project=ADNI
        target_kind: Advanced Search
      candidate_text_patterns:
        csv:
        - (?i)\bCSV\b
        - (?i)export.*csv
        - (?i)download.*csv
        advanced_download:
        - (?i)advanced\s*download
        one_click_download:
        - (?i)1[-\s]*click\s*download
        - (?i)one[-\s]*click\s*download
        add_to_collection:
        - (?i)add\s*to\s*collection
        data_collections:
        - (?i)data\s*collections?
        collection:
        - (?i)collection
        download:
        - (?i)download
  sync:
    transport_kind: approved_manifest_or_ida_discovery
    credential_required: true
    reuse_existing_files: true
    download_chunk_size_bytes: 1048576
    allowed_asset_kinds:
    - clinical_table
    - biomarker_table
    - genetics_table
    - medication_table
    - imaging_inventory
    - imaging_archive
    - omics_inventory
    allowed_data_domains:
    - clinical_longitudinal
    - visit_diagnosis
    - demographics
    - cognition
    - medications
    - genetics
    - mri_structural
    - mri_freesurfer
    - t1_inventory
    - pet_biomarker
    - fluid_biomarker
    - omics
    allowed_modalities:
    - clinical
    - apoe
    - mri
    - pet_amyloid
    - pet_tau
    - fdg_pet
    - csf
    - plasma
    - genomics
    scoped_unavailable_table_roles: []
    required_table_roles:
    - adni_merge_core
    - visit_diagnosis
    - demographics
    - cognitive_scores
    - neuropsychiatric_scores
    - medications
    - apoe_genetics
    - mri_freesurfer
    - t1_inventory
    - amyloid_pet
    - tau_pet
    - fdg_pet
    - csf_biomarkers
    - plasma_biomarkers
    - omics_inventory
    role_registry:
      adni_merge_core:
        required: true
        asset_kind: clinical_table
        data_domain: clinical_longitudinal
        modality: clinical
        target_relative_path: downloads/tables/ADNIMERGE.csv
        filename_patterns:
        - (?i)ADNIMERGE.*\.csv$
      visit_diagnosis:
        required: true
        asset_kind: clinical_table
        data_domain: visit_diagnosis
        modality: clinical
        target_relative_path: downloads/tables/ADNI_DX.csv
        filename_patterns:
        - (?i)(DXSUM|diagnos|visit).*\.csv$
      demographics:
        required: true
        asset_kind: clinical_table
        data_domain: demographics
        modality: clinical
        target_relative_path: downloads/tables/PTDEMOG.csv
        filename_patterns:
        - (?i)(PTDEMOG|demograph).*\.csv$
      cognitive_scores:
        required: true
        asset_kind: clinical_table
        data_domain: cognition
        modality: clinical
        target_relative_path: downloads/tables/NEUROBAT.csv
        filename_patterns:
        - (?i)(NEUROBAT|MMSE|CDR|ADAS|FAQ).*\.csv$
      neuropsychiatric_scores:
        required: true
        asset_kind: clinical_table
        data_domain: cognition
        modality: clinical
        target_relative_path: downloads/tables/NPIQ.csv
        filename_patterns:
        - (?i)(NPIQ?|Neuropsychiatric).*\.csv$
      medications:
        required: true
        asset_kind: medication_table
        data_domain: medications
        modality: clinical
        target_relative_path: downloads/tables/RECMHIST.csv
        filename_patterns:
        - (?i)(RECMHIST|MEDS|medication).*\.csv$
      apoe_genetics:
        required: true
        asset_kind: genetics_table
        data_domain: genetics
        modality: apoe
        target_relative_path: downloads/tables/APOERES.csv
        filename_patterns:
        - (?i)(APOERES|APOE).*\.csv$
      mri_freesurfer:
        required: true
        asset_kind: biomarker_table
        data_domain: mri_freesurfer
        modality: mri
        target_relative_path: downloads/tables/UCSFFSL.csv
        filename_patterns:
        - (?i)(UCSFFSL|FreeSurfer|FS).*\.csv$
      t1_inventory:
        required: true
        asset_kind: imaging_inventory
        data_domain: t1_inventory
        modality: mri
        target_relative_path: downloads/imaging/t1_inventory.csv
        filename_patterns:
        - (?i)(T1|MPRAGE|MRI).*inventory.*\.csv$
      amyloid_pet:
        required: true
        asset_kind: biomarker_table
        data_domain: pet_biomarker
        modality: pet_amyloid
        target_relative_path: downloads/tables/amyloid_pet.csv
        filename_patterns:
        - (?i)(AV45|AMYLOID|Florbetapir).*\.csv$
      tau_pet:
        required: true
        asset_kind: biomarker_table
        data_domain: pet_biomarker
        modality: pet_tau
        target_relative_path: downloads/tables/tau_pet.csv
        filename_patterns:
        - (?i)(AV1451|TAU|Flortaucipir).*PET.*\.csv$
      fdg_pet:
        required: true
        asset_kind: biomarker_table
        data_domain: pet_biomarker
        modality: fdg_pet
        target_relative_path: downloads/tables/fdg_pet.csv
        filename_patterns:
        - (?i)(FDG).*\.csv$
      csf_biomarkers:
        required: true
        asset_kind: biomarker_table
        data_domain: fluid_biomarker
        modality: csf
        target_relative_path: downloads/tables/csf_biomarkers.csv
        filename_patterns:
        - (?i)(CSF|ABETA|PTAU).*\.csv$
      plasma_biomarkers:
        required: true
        asset_kind: biomarker_table
        data_domain: fluid_biomarker
        modality: plasma
        target_relative_path: downloads/tables/plasma_biomarkers.csv
        filename_patterns:
        - (?i)(PLASMA|NfL|GFAP).*\.csv$
      omics_inventory:
        required: true
        asset_kind: omics_inventory
        data_domain: omics
        modality: genomics
        target_relative_path: downloads/tables/omics_inventory.csv
        filename_patterns:
        - (?i)(omics|genomics|GWAS|WGS|RNA).*\.csv$
    approved_asset_manifest_fields:
    - asset_uid
    - include_flag
    - transport_kind
    - asset_kind
    - data_domain
    - table_role
    - modality
    - adni_cohort
    - source_url
    - source_path
    - target_relative_path
    - participant_level_flag
    - allowed_use
    - notes
    receipt_fields:
    - asset_uid
    - asset_kind
    - data_domain
    - table_role
    - modality
    - adni_cohort
    - local_path_private
    - checksum_sha256
    - size_bytes
    - sync_date
    - status
    - participant_level_flag
    - allowed_use
    - notes
    authenticated_http:
      authentication_order: browser_cookie_jar_first
      password_login_fallback: false
      cookie_jar_path: Input/private/adni/secrets/ida.loni.usc.edu_cookies.txt
      candidate_cookie_jar_paths:
      - Input/private/adni/secrets/cookies.txt
      cookie_jar_format: netscape_mozilla
      cookie_domain_allowlist:
      - ida.loni.usc.edu
      - .ida.loni.usc.edu
      - .loni.usc.edu
      - .usc.edu
      authentication_kind: form_post
      login_url: https://ida.loni.usc.edu/login.jsp?project=ADNI
      submit_url: https://ida.loni.usc.edu/explore/jsp/common/login.jsp
      email_field: userEmail
      password_field: userPassword
      extra_post_fields:
        isAjax: "true"
      hidden_field_names:
      - project
      csrf_field_names:
      - csrf
      - _csrf
      - authenticity_token
      form_field_selectors:
        email: input[name="userEmail"]
        password: input[name="userPassword"]
        csrf: input[type="hidden"]
      cookie_policy:
        require_session_cookie: true
        allowed_session_cookie_names:
        - JSESSIONID
        - ida_session
        - IDA_USC
        - BIGipServerweb_loni
        accept_zero_expiry_session_cookies: true
        zero_expiry_session_cookie_names:
        - JSESSIONID
        - IDA_USC
        - BIGipServerweb_loni
        accepted_policy_cookie_name: idaCookiePolicy
        accepted_policy_cookie_value: "true"
      success_text_patterns:
      - (?i)success
      - (?i)logout
      - (?i)study data
      success_status_codes:
      - 200
      login_page_text_patterns:
      - (?i)<input[^>]+name=["']userEmail["']
      - (?i)<input[^>]+name=["']userPassword["']
      authenticated_entry_text_patterns:
      - (?i)download
      - (?i)study data
      - (?i)archive
      - (?i)Analysis Ready Cohort
      request_headers:
        User-Agent: NeuronSifterADNIControlledAccess/2026-05-12
      network_policy:
        use_environment_proxy: false
    ida_discovery:
      enabled: true
      required_gate: false
      link_href_regex: href=["']([^"']+)["']
      discovery_targets:
      - target_key: study_data_tables
        url: https://ida.loni.usc.edu/explore/jsp/search_v2/search.jsp?project=ADNI
        target_kind: ARC Builder
      - target_key: arc_downloads
        url: https://ida.loni.usc.edu/pages/access/search.jsp?page=DOWNLOADS&project=ADNI&subPage=IMAGE_COLLECTIONS&tab=collection
        target_kind: ARC
