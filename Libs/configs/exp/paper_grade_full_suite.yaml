  - Libs/scripts/validators/validate_formal_experiment_readiness.py
  - Libs/scripts/validators/validate_formal_experiment_freeze.py --no-write
  - Libs/scripts/validators/validate_multimodal_twin_data_alignment.py
  - Libs/scripts/validators/validate_world_foundation_model_claims.py
  - Libs/scripts/validators/validate_paper_grade_full_suite.py
  postrun_gates:
