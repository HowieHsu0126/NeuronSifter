  osp_native_physical_program:
    mode: osp_source_bound_equilibrium.v1
    invocation: explicit_native_physical_input_and_native_output
    source_input: completed_osp_csv_and_bound_run_parameter_readback
    design_required: [design_id, source_posterior_uid, support, observations, region_ids, compartment_ids, time_grid_hours, graph_ref, organism_context, actions, exports]
    export_required: [sample_uid, particle_uid, regimen_uid, csv_path, run_snapshot_path, binding]
    run_required: [source_model_id, source_run_id, source_snapshot_ref, model_path, model_sha256, export_sha256, settings_origin, particle_basis, particle_parameter_paths, quantities]
    action_setting_paths: [dose, dose_unit, route, schedule, duration, agent_set]
    quantity_required: [site_uid, ligand_uid, target_uid, quantity_kind, concentration_unit, time_unit]
    binding_required: [source_uid, source_snapshot_ref, source_posterior_uid, support_uid, sample_uid, particle_uid, regimen_uid, particle_basis, particle_parameters, action_setting_paths, site_mappings, interpolation, binding_law, requested_readout]
    site_mapping_required: [region_id, compartment_id, site_uid, source_output_path, kd_source_path, kd_binding]
    kd_binding_kinds: [particle_parameter, fixed_source_affinity]
    particle_kd_binding: exact_named_particle_parameter_source_path_and_value
    fixed_kd_binding: exact_named_fixed_affinity_paths_source_path
    kd_record_required: [value, unit, source_ref, quantity_kind, binding_scope, source_uid, source_snapshot_ref, site_uid, ligand_uid, target_uid]
    kd_quantity_kind: equilibrium_dissociation_constant
    particle_kd_required: [particle_uid]
    fixed_kd_policy: identical_named_source_affinity_across_whole_particles_no_particle_override
    total_concentration_requires: [unbound_fraction_source_path, site_uid, particle_uid, free_over_total_same_site, source_ref]
    supported_binding_law: single_ligand_equilibrium
    supported_readout: fractional_occupancy
    interpolation: [exact, linear_inside_coverage]
    output_location: native_joint_observation_source.particle_programs.records.physical_program
    retained_arrays: [free_concentration_mol_per_l, target_occupancy_fraction, occupancy, support, physical_time]
    retained_metadata: [inputs, target_parameters]
    admission: rederive_from_retained_source_and_match_compiler_and_outer_arrays
    biological_calibration: unverified
    teacher_confidence: not_produced

  native_joint_observation_source:
    schema_version: native_joint_observation_source.v1
    required_fields: [schema_version, source_posterior_uid, support, observations, particle_programs]
    source_input_kind: source_declared_prior_support_and_retained_readouts
    forbidden_source_fields: [joint_posterior, particle_context, weights, log_weights, generating_indices, generating_fields]
    factors: [z_tx, z_pk, z_env, z_ephys, z_morph]
    support_axes: [sample, particle, region, compartment, species]
    prior_weight_axes: [sample, particle]
    program_axes: [sample, particle, action, time, region, compartment, scalar]
    likelihoods: [negative_binomial, log_normal, gaussian, categorical]
    missingness: marginalize_unobserved
    censoring: log_normal_detection_limit_event
    informative_admission: require_explicit_event_likelihood
    admission_log_probability_encoding: finite_number_or_negative_infinity_token
    negative_infinity_token: "-inf"
    missing_measurement_encoding: null
    occupancy: explicitly_registered_assay_only
    source_nuisance: separate_per_channel
    compiler_lineage: preserve_source_posterior_uid_and_complete_particle_basis
    model_output_lineage: live_posterior_uid_binds_normalized_log_weights_and_context
    cache_policy: cache_source_inputs_reinfer_model_outputs
    calibrated: false
    local_membrane:
      optional_support_field: local_membrane
      snapshot_schema_version: local_membrane_snapshot.v1
      snapshot_fields: [schema_version, coordinate_uid, source_uid, source_snapshot_ref, support_uid, role, sample_uids, particle_uids, region_ids, compartment_ids, sites, voltage_convention, voltage_unit, time_unit, clock_uid, time_origin_uid, hour_origin, current_time_ms, acquisition_cutoff_ms, voltage, axes]
      site_fields: [site_uid, membrane_ref, anatomy_ref, region_id, adjacent_compartment_id, voltage_reference_uid, intracellular_ref, extracellular_ref]
      axes: [sample, particle, site]
      voltage_unit: mV
      voltage_convention: intracellular_minus_extracellular
      incidence: named_membrane_to_cns_grid_not_state_alias
      local_time_unit: ms
      clock_dtype: float64
      hour_origin: separate_scalar_with_clock_and_origin_identity
      observation_field: physical_acquisition
      acquisition_fields: [coordinate_uid, support_uid, site_uids, voltage_reference_uids, voltage_convention, clock_uid, time_origin_uid, hour_origin, time_unit, mode, measurement_time_ms, acquired_time_ms]
      acquisition_mode: exact_snapshot
      acquisition_constraint: measurement_equals_current_and_measurement_le_acquired_le_cutoff
      readout_metadata_fields: [kind, coordinate_uid, site_uids, voltage_reference_uids]
      readout: physical_H_equals_same_particle_V
      free_readout_mean: forbidden
      error_model_fields: [error_model_uid, source_ref, evidence_kind, source_uid, source_snapshot_ref, support_uid, channel_uid, calibration_status]
      error_law: explicitly_source_declared_existing_continuous_law
      error_parameters: explicitly_supplied_no_defaults_or_fitting
      missing_error_binding: unbound_channel_cannot_condition
      controlled_error_evidence_kind: synthetic_fixture
      calibration_status: unverified
      electrical_evolution_status: unbound
      identity: consumed_posterior_and_whole_physical_program_basis

