    receipt_relative_path: downloads/download_receipts.tsv
  geo:
    selection_mode: include_flag_yes
    receipt_relative_path: downloads/download_receipts.tsv
    ftp_base: https://ftp.ncbi.nlm.nih.gov/geo/series
  arrayexpress:
    selection_mode: include_flag_yes
    receipt_relative_path: downloads/download_receipts.tsv
    detail_relative_dir: downloads/study_details
    download_relative_dir: downloads/studies
    file_url_template: https://www.ebi.ac.uk/biostudies/files/{accession}/{file_path}
    allowed_attribute_types:
    - IDF File
    - SDRF File
    - ADF File
    detail_matrix_name_keywords:
    - normalizedcount
    - processed-data
    - sample_table
    - counts
    - matrix
    detail_matrix_extensions:
    - .txt
    - .tsv
    - .csv
    - .xls
    - .xlsx
    detail_raw_extensions:
    - .cel
    - .cel.gz
  metabolomics_workbench:
    selection_mode: include_flag_yes
    receipt_relative_path: downloads/download_receipts.tsv
    available_url_template: https://www.metabolomicsworkbench.org/rest/study/study_id/{study_id}/available
    summary_url_template: https://www.metabolomicsworkbench.org/rest/study/study_id/{study_id}/summary
    mwtab_url_template: https://www.metabolomicsworkbench.org/rest/study/study_id/{study_id}/mwtab/txt
    factors_url_template: https://www.metabolomicsworkbench.org/rest/study/study_id/{study_id}/factors
    data_url_template: https://www.metabolomicsworkbench.org/rest/study/study_id/{study_id}/data
  chembl:
    receipt_relative_path: downloads/download_receipts.tsv
    public_assets:
    - asset_name: ftp_latest_index
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/
      relative_path: downloads/releases/latest_index.html
      response_kind: text
    - asset_name: api_status_xml
      asset_url: https://www.ebi.ac.uk/chembl/api/data/status
      relative_path: downloads/releases/chembl_status.xml
      response_kind: text
    - asset_name: latest_readme
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/README
      relative_path: downloads/releases/README
      response_kind: text
    - asset_name: latest_license
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/LICENSE
      relative_path: downloads/releases/LICENSE
      response_kind: text
    - asset_name: latest_required_attribution
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/REQUIRED.ATTRIBUTION
      relative_path: downloads/releases/REQUIRED.ATTRIBUTION
      response_kind: text
    - asset_name: latest_checksums
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/checksums.txt
      relative_path: downloads/releases/checksums.txt
      response_kind: text
    - asset_name: latest_release_notes
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/chembl_36_release_notes.txt
      relative_path: downloads/releases/chembl_36_release_notes.txt
      response_kind: text
    - asset_name: chemreps_txt_gz
      asset_url: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest/chembl_36_chemreps.txt.gz
      relative_path: downloads/releases/chembl_36_chemreps.txt.gz
      response_kind: binary
  drugcentral:
    receipt_relative_path: downloads/download_receipts.tsv
    public_assets:
    - asset_name: target_interaction_tsv_gz
      asset_url: https://unmtid-dbs.net/download/DrugCentral/2021_09_01/drug.target.interaction.tsv.gz
      relative_path: downloads/releases/2021_09_01/drug.target.interaction.tsv.gz
      response_kind: binary
    - asset_name: structures_smiles_tsv
      asset_url: https://unmtid-dbs.net/download/DrugCentral/2021_09_01/structures.smiles.tsv
      relative_path: downloads/releases/2021_09_01/structures.smiles.tsv
      response_kind: text
    - asset_name: structures_molv2_sdf_gz
      asset_url: https://unmtid-dbs.net/download/DrugCentral/2023/structures.molV2.sdf.gz
      relative_path: downloads/releases/2023/structures.molV2.sdf.gz
      response_kind: binary
    - asset_name: structures_molv3_sdf_gz
      asset_url: https://unmtid-dbs.net/download/DrugCentral/2023/structures.molV3.sdf.gz
      relative_path: downloads/releases/2023/structures.molV3.sdf.gz
      response_kind: binary
    - asset_name: fda_approved_csv
      asset_url: https://drugcentral.org/static/FDA_Approved.csv
      relative_path: downloads/releases/static/FDA_Approved.csv
      response_kind: text
    - asset_name: ema_approved_csv
      asset_url: https://drugcentral.org/static/EMA_Approved.csv
      relative_path: downloads/releases/static/EMA_Approved.csv
      response_kind: text
    - asset_name: pmda_approved_csv
      asset_url: https://drugcentral.org/static/PMDA_Approved.csv
      relative_path: downloads/releases/static/PMDA_Approved.csv
      response_kind: text
    - asset_name: fda_ema_pmda_approved_csv
      asset_url: https://drugcentral.org/static/FDA+EMA+PMDA_Approved.csv
      relative_path: downloads/releases/static/FDA+EMA+PMDA_Approved.csv
      response_kind: text
  bindingdb:
    receipt_relative_path: downloads/download_receipts.tsv
    public_assets:
    - asset_name: all_tsv_zip
      asset_url: https://www.bindingdb.org/rwd/bind/downloads/BindingDB_All_202604_tsv.zip
      relative_path: downloads/releases/BindingDB_All_202604_tsv.zip
      response_kind: binary
    - asset_name: all_tsv_md5
      asset_url: https://www.bindingdb.org/rwd/bind/downloads/BindingDB_All_202604_tsv.md5
      relative_path: downloads/releases/BindingDB_All_202604_tsv.md5
      response_kind: text
    - asset_name: target_sequences_fasta
      asset_url: https://www.bindingdb.org/rwd/bind/BindingDBTargetSequences.fasta
      relative_path: downloads/releases/BindingDBTargetSequences.fasta
      response_kind: text
    - asset_name: tsv_format_pdf
      asset_url: https://www.bindingdb.org/rwd/bind/chemsearch/marvin/BindingDB-TSV-Format.pdf
      relative_path: downloads/releases/BindingDB-TSV-Format.pdf
      response_kind: binary
    - asset_name: cid_mapping
      asset_url: https://www.bindingdb.org/rwd/bind/BindingDB_CID.txt
      relative_path: downloads/releases/BindingDB_CID.txt
      response_kind: text
    - asset_name: uniprot_mapping
      asset_url: https://www.bindingdb.org/rwd/bind/BindingDB_UniProt.txt
      relative_path: downloads/releases/BindingDB_UniProt.txt
      response_kind: text
    - asset_name: drugbank_mapping
      asset_url: https://www.bindingdb.org/rwd/bind/BindingDB_DrugBankID.txt
      relative_path: downloads/releases/BindingDB_DrugBankID.txt
      response_kind: text
    - asset_name: pubmed_mapping
      asset_url: https://www.bindingdb.org/rwd/bind/BindingDB_PubMed.txt
      relative_path: downloads/releases/BindingDB_PubMed.txt
      response_kind: text
  dgidb:
    receipt_relative_path: downloads/download_receipts.tsv
    release_api_url: https://api.github.com/repos/dgidb/dgidb-v5/releases/latest
    release_relative_dir: downloads/releases
  open_targets:
    receipt_relative_path: downloads/download_receipts.tsv
    public_assets:
    - asset_name: ftp_output_index
      asset_url: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/25.03/output/
      relative_path: downloads/releases/25.03/output_index.html
      response_kind: text
    directory_assets:
    - asset_name: disease
      listing_url: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/25.03/output/disease/
      listing_relative_path: downloads/releases/25.03/disease/listing.html
      relative_dir: downloads/releases/25.03/disease
      include_patterns:
      - disease.parquet
    - asset_name: target
      listing_url: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/25.03/output/target/
      listing_relative_path: downloads/releases/25.03/target/listing.html
      relative_dir: downloads/releases/25.03/target
      include_patterns:
      - _SUCCESS
      - part-
    - asset_name: known_drug
      listing_url: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/25.03/output/known_drug/
      listing_relative_path: downloads/releases/25.03/known_drug/listing.html
      relative_dir: downloads/releases/25.03/known_drug
      include_patterns:
      - _SUCCESS
      - part-
    - asset_name: drug_molecule
      listing_url: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/25.03/output/drug_molecule/
      listing_relative_path: downloads/releases/25.03/drug_molecule/listing.html
      relative_dir: downloads/releases/25.03/drug_molecule
      include_patterns:
      - _SUCCESS
      - part-
    - asset_name: association_overall_direct
      listing_url: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/25.03/output/association_overall_direct/
      listing_relative_path: downloads/releases/25.03/association_overall_direct/listing.html
      relative_dir: downloads/releases/25.03/association_overall_direct
      include_patterns:
      - _SUCCESS
      - part-
  allen_brain_cell_atlas:
    receipt_relative_path: downloads/download_receipts.tsv
    public_assets:
    - asset_name: access_intro_html
      asset_url: https://alleninstitute.github.io/abc_atlas_access/intro.html
      relative_path: downloads/releases/20250531/abc_atlas_access_intro.html
      response_kind: text
    - asset_name: release_manifest_json
      asset_url: https://allen-brain-cell-atlas.s3.amazonaws.com/releases/20250531/manifest.json
      relative_path: downloads/releases/20250531/manifest.json
      response_kind: json
    s3_prefix_assets:
    - asset_name: seaad_taxonomy
      listing_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/?list-type=2&prefix=metadata/SEAAD-taxonomy/20240131/
      listing_relative_path: downloads/releases/20250531/SEAAD-taxonomy/listing.xml
      relative_dir: downloads/releases/20250531/SEAAD-taxonomy
      base_download_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/
      include_files:
      - metadata/SEAAD-taxonomy/20240131/cluster_annotation_term.csv
      - metadata/SEAAD-taxonomy/20240131/cluster_annotation_term_set.csv
      - metadata/SEAAD-taxonomy/20240131/cluster_to_cluster_annotation_membership.csv
    - asset_name: seaad_mapmycells
      listing_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/?list-type=2&prefix=mapmycells/SEAAD/20240831/
      listing_relative_path: downloads/releases/20250531/SEAAD/listing.xml
      relative_dir: downloads/releases/20250531/SEAAD
      base_download_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/
      include_files:
      - mapmycells/SEAAD/20240831/precomputed_stats.20231120.sea_ad.MTG.h5
    - asset_name: whb_taxonomy
      listing_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/?list-type=2&prefix=metadata/WHB-taxonomy/20240330/
      listing_relative_path: downloads/releases/20250531/WHB-taxonomy/listing.xml
      relative_dir: downloads/releases/20250531/WHB-taxonomy
      base_download_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/
      include_files:
      - metadata/WHB-taxonomy/20240330/cluster.csv
      - metadata/WHB-taxonomy/20240330/cluster_annotation_term.csv
      - metadata/WHB-taxonomy/20240330/cluster_annotation_term_set.csv
      - metadata/WHB-taxonomy/20240330/cluster_to_cluster_annotation_membership.csv
    - asset_name: whb_metadata
      listing_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/?list-type=2&prefix=metadata/WHB-10Xv3/20241115/
      listing_relative_path: downloads/releases/20250531/WHB-10Xv3/listing.xml
      relative_dir: downloads/releases/20250531/WHB-10Xv3
      base_download_url: https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/
      include_files:
      - metadata/WHB-10Xv3/20241115/anatomical_division_structure_map.csv
      - metadata/WHB-10Xv3/20241115/cell_metadata.csv
      - metadata/WHB-10Xv3/20241115/donor.csv
      - metadata/WHB-10Xv3/20241115/gene.csv
      - metadata/WHB-10Xv3/20241115/region_of_interest_structure_map.csv
  biccn_public:
    receipt_relative_path: downloads/download_receipts.tsv
    public_assets:
    - asset_name: biccn_data_page
      asset_url: https://biccn.org/data
      relative_path: downloads/releases/public/biccn_data_page.html
      response_kind: text
    - asset_name: biccn_home_page
      asset_url: https://biccn.org/
      relative_path: downloads/releases/public/biccn_home_page.html
      response_kind: text
  clue_lincs:
    receipt_relative_path: downloads/download_receipts.tsv
    manual_note_relative_path: downloads/manual_access_requirements.md
    manual_status: blocked_account_required
    manual_note: CLUE version pages are public, but signature-level data files require
      a CLUE account and access key under the published terms.
  nemo_archive:
    receipt_relative_path: downloads/download_receipts.tsv
    manual_note_relative_path: downloads/manual_collection_requirements.md
    manual_status: blocked_discovery_required
    manual_note: NeMO public-data guides are public, but metadata APIs require JWT
      credentials and collection-specific HTTP landing pages must be identified before
      bulk public asset download.
    public_assets:
    - asset_name: data_download_guide
      asset_url: https://nemoarchive.org/resources/data-download
      relative_path: downloads/nemo_data_download.html
      response_kind: text
    - asset_name: api_overview
      asset_url: https://nemoarchive.org/resources/nemo-api-overview.php
      relative_path: downloads/nemo_api_overview.html
      response_kind: text
  drugcomb:
    receipt_relative_path: downloads/download_receipts.tsv
    manual_note_relative_path: downloads/manual_access_requirements.md
    manual_status: blocked_network_environment
    manual_note: DrugComb official web and API endpoints must be reprobed from the
      current environment before the public download queue can be considered automatable.
sources:
  oasis:
    source_name: OASIS
    source_url: https://dev.oasis-brains.org/
    release_label: public_snapshot
    release_date: null
    access_mode: click_through_terms
    license_or_terms: non-commercial academic use with anti-reidentification restrictions
    disease_scope:
    - Alzheimer disease
    - mild cognitive impairment
    - normal aging
    modality_scope:
    - clinical
    - cognitive
    - biomarker
    - imaging_optional
    query_scope: historical_optional only; historical OASIS-3 and OASIS-4 tabular snapshots
      remain preserved outside the v2 mainline
    local_root: Input/raw/oasis
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - downloads/manual_drop
    - manifests
    - terms
    - checksums
    - tabular
    - imaging_optional
    snapshot_urls:
    - filename: oasis_landing_page.html
      url: https://dev.oasis-brains.org/
    - filename: oasis_access_page.html
      url: https://sites.wustl.edu/oasisbrains/access/
    term_urls:
    - filename: oasis_terms_snapshot.html
      url: https://sites.wustl.edu/oasisbrains/access/
    notes: Legacy optional source retained for traceability only. OASIS no longer
      participates in the v2 public mainline or benchmark completion gate.
    include_targets:
    - OASIS-3 clinical tables
    - OASIS-3 cognitive tables
    - OASIS-3 biomarker tables
    - OASIS-4 public tabular metadata when aligned with AD or aging
    exclude_targets:
    - raw image archives during startup
    - non-AD or non-aging disease programs
  allen_brain_cell_atlas:
    source_name: Allen Brain Cell Atlas
    source_url: https://alleninstitute.org/science-resource/introduction-to-abc-atlas/
    release_label: public_snapshot
    release_date: null
    access_mode: public
    license_or_terms: source-specific public terms at Allen Institute portals
    disease_scope:
    - Alzheimer disease
    - normal aging
    modality_scope:
    - cell_metadata
    - taxonomy
    - expression_matrix
    - spatial_metadata
    query_scope: Human whole brain and human Alzheimer atlas prior only in the v2
      mainline.
    local_root: Input/raw/allen_brain_cell_atlas
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - downloads/manual_drop
    - manifests
    - terms
    - checksums
    snapshot_urls:
    - filename: abc_atlas_intro.html
      url: https://alleninstitute.org/science-resource/introduction-to-abc-atlas/
    - filename: cell_types_portal.html
      url: https://celltypes.brain-map.org/
    term_urls:
    - filename: allen_terms_snapshot.html
      url: https://alleninstitute.org/terms-of-use/
    notes: Primary atlas prior source for the v2 public AD or aging world-model route.
    include_targets:
    - human whole brain taxonomy
    - human Alzheimer cell metadata
    - human spatial metadata
    exclude_targets:
    - mouse patient-level surrogates
    - non-brain tissue releases
  biccn_public:
    source_name: BICCN Public
    source_url: https://biccn.org/data
    release_label: public_snapshot
    release_date: null
    access_mode: public
    license_or_terms: source-specific public terms at the BICCN data portal and linked
      archives
    disease_scope:
    - normal aging
    modality_scope:
    - atlas_metadata
    - public_catalog
    - reference_index
    query_scope: Public BICCN atlas access metadata and archive routing only in the
      v2 mainline.
    local_root: Input/raw/biccn_public
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - manifests
    - terms
    - checksums
    - accession_freeze
    snapshot_urls:
    - filename: biccn_data_page.html
      url: https://biccn.org/data
    - filename: biccn_home.html
      url: https://biccn.org/
    term_urls:
    - filename: biccn_data_snapshot.html
      url: https://biccn.org/data
    notes: Secondary atlas prior routing source for the v2 public AD or aging world-model
      route.
    include_targets:
    - public atlas access metadata
    - public human sample routing metadata
    - public archive index snapshots
    exclude_targets:
    - restricted human bundles
    - raw sequencing archives
    catalog_rows:
    - source_accession: BICCN_PUBLIC_DATA
      title: BICCN public data access and public archive routing
      species: Homo sapiens
      tissue_or_biofluid: brain tissue
      modality: atlas_metadata
      sample_context: atlas_prior
      diagnosis_label: normal aging
      case_count: ''
      control_count: ''
      public_url: https://biccn.org/data
      include_flag: 'yes'
      exclusion_reason: ''
      source_repository: BICCN public
      release_type: metadata_only
      data_granularity: atlas_level
      subject_linkable_flag: 'no'
      provenance_level: publication_curated
      world_model_role: atlas_prior
      cohort_or_atlas_family: allen_biccn_atlas
  nemo_archive:
    source_name: NeMO Archive
    source_url: https://nemoarchive.org/data
    release_label: public_snapshot
    release_date: null
    access_mode: public
    license_or_terms: source-specific public data use terms at NeMO Archive
    disease_scope:
    - Alzheimer disease
    - normal aging
    modality_scope:
    - multiomics_matrix
    - sample_metadata
    - taxonomy
    - reference
    query_scope: historical_optional only; historical NeMO public discovery remains preserved
      outside the v2 mainline
    local_root: Input/raw/nemo_archive
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - downloads/manual_drop
    - manifests
    - terms
    - checksums
    snapshot_urls:
    - filename: nemo_data_portal.html
      url: https://nemoarchive.org/data
    - filename: nemo_home.html
      url: https://nemoarchive.org/
    term_urls:
    - filename: nemo_terms_snapshot.html
      url: https://nemoarchive.org/
    notes: Legacy optional source retained for historical traceability only. NeMO
      no longer participates in the v2 public mainline completion gate.
    include_targets:
    - public matrix files
    - sample metadata
    - taxonomy references
    exclude_targets:
    - FASTQ
    - BAM
    - controlled-access bundles
  clue_lincs:
    source_name: CLUE LINCS
    source_url: https://clue.io/version-data
    release_label: public_snapshot
    release_date: null
    access_mode: public
    license_or_terms: source-specific public terms at CLUE
    disease_scope:
    - perturbation_reference
    modality_scope:
    - signature
    - perturbagen_metadata
    - cell_metadata
    query_scope: Signature-level perturbation assets only; plate-level measurements
      remain excluded.
    local_root: Input/raw/clue_lincs
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - downloads/manual_drop
    - manifests
    - terms
    - checksums
    snapshot_urls:
    - filename: clue_version_data.html
      url: https://clue.io/version-data
    - filename: clue_home.html
      url: https://clue.io/
    term_urls:
    - filename: clue_terms_snapshot.html
      url: https://clue.io/terms
    notes: Signature-level perturbation data are used for perturbation geometry pretraining
      only.
    include_targets:
    - signatures
    - perturbagen metadata
    - cell metadata
    exclude_targets:
    - raw plate measurements
    - assay-level images
  open_targets:
    source_name: Open Targets
    source_url: https://platform-docs.opentargets.org/
    release_label: public_snapshot
    release_date: null
    access_mode: public
    license_or_terms: source-specific public platform documentation and release notes
    disease_scope:
    - Alzheimer disease
    - normal aging
    modality_scope:
    - target_disease_evidence
    - target_metadata
    - disease_metadata
    query_scope: Alzheimer and aging evidence exports only; no full-platform mirror
      in startup.
    local_root: Input/raw/open_targets
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - manifests
    - terms
    - checksums
    snapshot_urls:
    - filename: open_targets_docs_home.html
      url: https://platform-docs.opentargets.org/
    - filename: open_targets_evidence_docs.html
      url: https://platform-docs.opentargets.org/evidence
    term_urls:
    - filename: open_targets_docs_snapshot.html
      url: https://platform-docs.opentargets.org/
    notes: The startup queue only preserves Alzheimer and aging evidence exports with
      supporting target and disease metadata.
    include_targets:
    - Alzheimer evidence
    - aging evidence
    - target metadata
    - disease metadata
    exclude_targets:
    - full platform mirror
  chembl:
    source_name: ChEMBL
    source_url: https://www.ebi.ac.uk/chembl/
    release_label: public_snapshot
    release_date: null
    access_mode: public
    license_or_terms: source-specific public ChEMBL terms
    disease_scope:
    - pharmacology_reference
    modality_scope:
    - bioactivity
    - target_annotation
    - compound_annotation
    query_scope: Public release and bulk-export metadata only during startup.
    local_root: Input/raw/chembl
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - manifests
    - terms
    - checksums
    snapshot_urls:
    - filename: chembl_home.html
      url: https://www.ebi.ac.uk/chembl/
    - filename: chembl_overview.html
      url: https://www.ebi.ac.uk/training/online/courses/chembl-quick-tour/what-is-chembl/
    term_urls:
    - filename: chembl_home_snapshot.html
      url: https://www.ebi.ac.uk/chembl/
    notes: ChEMBL is used as a raw reference source only; cross-source merging remains
      a processed-layer step.
    include_targets:
    - bulk export metadata
