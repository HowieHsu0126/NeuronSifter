paper_grade_full_suite:
  suite_name: Paper-Grade Full Suite v1
  suite_id: ad_paper_grade_full_formal_suite
  suite_version: v1
  suite_release: v1
  suite_config_materialized: false
  disease_programs:
  - ad_control
  forbidden_disease_programs:
  - pd_control
  - ftd_control
  - als_control
  controlled_access_policy:
    adni_role: audit_only
    allow_adni_in_formal_training: false
    allow_adni_in_main_tables: false
    allowed_outputs:
    - registry_governance_audit
    - aggregate_validation_bridge
  formal_seed_values:
  - 40
  - 41
  - 42
  - 43
  - 44
  seeds:
  - 40
  - 41
  - 42
  - 43
  - 44
  cluster:
    suite_config_output: Output/paper_configs/paper_grade_full_suite/materialized_config.yaml
    print_only_root: Output/logs/print_only/paper_grade_full_suite
    cpu_gate:
      partition: cpu
      nodelist: cpu04
      cpus_per_task: 4
      mem: 16G
      gres: ''
    cpu_large:
      partition: gpu
      nodelist: cpu03
      cpus_per_task: 8
      mem: 48G
      gres: ''
    gpu_train:
      partition: gpu1
      nodelist: gpu03
      cpus_per_task: 8
      mem: 48G
      gres: gpu:1
  runtime_protocol:
    checkpointable_split_enabled: true
    submission_throttle_seconds: 0.05
    profiling:
      enabled: true
      runtime_profile_schema_version: paper_grade_runtime_profile.v1
      record_wall_time_seconds: true
      record_micro_batch_per_second: true
      record_regimen_per_second: true
      record_gpu_memory_mb: true
      record_max_rss_mb: true
      record_checkpoint_io_seconds: true
      record_data_materialization_seconds: true
      parameter_scan_policy:
        status: profiler_proposal_only
        scope: one_fold_one_window_one_seed
        write_to_formal_yaml_only_after_validation: true
        scanned_fields:
        - screening_benchmark.training.memory_policy.micro_batch_size
        - screening_benchmark.training.regimen_minibatch.candidate_count
        - screening_benchmark.execution_controls.regimen_chunk_size
        - screening_benchmark.model_architecture.rollout_operator.activation_checkpointing
    cpu_precompute:
      enabled: true
      materialize_training_tensor_cache: true
      resource_profile: cpu_large
      output_manifest_name: training_cache_manifest.json
      stale_cache_status: cache_stale
      allow_gpu_job_cache_rebuild: false
    gpu_concurrency_policy:
      serialized_gpu_training_windows: true
      allow_cpu_jobs_parallel_with_gpu_training: true
      exact_prefix_queue_scan_required_before_live: true
      prefix_scan_pattern: NrnSift_
    screening_training:
      scope_plan: fold_and_production
      max_epochs: 40
      patience_epochs: 6
      epoch_window_count: 8
      epoch_window_labels:
      - warmup_curve
      - early_discrimination_curve
      - counterfactual_alignment_curve
      - pkpd_consistency_curve
      - tri_stability_curve
      - calibration_curve
      - convergence_curve
      - terminal_patience_probe
    commands:
      cache_precompute: '{python_executable} -u Libs/exp/training/precompute_screening_training_cache.py --config {config_path} --training-scope {training_scope} --fold-name {fold_name} --disease-program {disease_program}'
      pretraining: '{python_executable} -u Libs/exp/training/pretrain_microenvironment_world_model.py --config {config_path} --device {device}'
      screening_window: '{python_executable} -u Libs/exp/training/train_screening_system.py --config {config_path} --training-scope {training_scope} --fold-name {fold_name} --device {device} --max-epochs-override {max_epochs} --patience-epochs-override {patience_epochs} --training-window-ordinal {training_window_ordinal} --training-window-count {training_window_count}'
      evaluation: '{python_executable} -u Libs/exp/evaluation/evaluate_screening_system.py --config {config_path}'
      active_learning_replay: '{python_executable} -u Libs/exp/evaluation/evaluate_active_learning_replay.py --config {config_path}'
      export: '{python_executable} -u Libs/exp/export/export_screening_bundle.py --config {config_path}'
  user_entrypoint: Libs/scripts/experiments/run_paper_grade_full_suite.sh
  developer_entrypoint: Libs/exp/submission/submit_paper_grade_full_suite.sh
  freeze_binding_policy:
    live_requires_current_freeze_manifest: true
    refreeze_required_after_code_or_config_change: true
    formal_replay_gate: Libs/scripts/validators/validate_formal_experiment_freeze.py --no-write
    freeze_manifest_path: Output/audits/formal_experiment_freeze_manifest.json
  freeze_policy:
    live_requires_current_freeze_manifest: true
    refreeze_required_after_code_or_config_change: true
    formal_replay_gate: Libs/scripts/validators/validate_formal_experiment_freeze.py --no-write
    freeze_manifest_path: Output/audits/formal_experiment_freeze_manifest.json
  resource_profiles:
    config_path: Libs/configs/exp/resource_profiles.yaml
    profile_ids:
    - cpu_light
    - cpu_heavy
    - gpu_single
    - gpu_diffusion
    - gpu_multiseed
    - aggregation_cpu
    - report_cpu
  output_specs:
    config_path: Libs/configs/exp/output_specs.yaml
    standard_run_artifacts:
    - metrics.json
    - run_metadata.json
    - artifact_hashes.json
    - status.json
    - artifact_manifest.json
  claim_guardrails:
    config_path: Libs/configs/exp/claim_guardrails.yaml
    enforce_in_public_reports: true
    preserve_statuses:
      g2_status: G2_pass_with_warnings
      g5_status: G5_not_passed
  task_block_paths:
    world_model_pretraining: Libs/configs/exp/task_blocks/world_model_pretraining.yaml
    screening_supervised: Libs/configs/exp/task_blocks/screening_supervised.yaml
    rollout_prediction: Libs/configs/exp/task_blocks/rollout_prediction.yaml
    counterfactual_evaluation: Libs/configs/exp/task_blocks/counterfactual_evaluation.yaml
    published_ad_sift_reproduction: Libs/configs/exp/task_blocks/published_ad_sift_reproduction.yaml
    architecture_ablation: Libs/configs/exp/task_blocks/architecture_ablation.yaml
    action_ablation: Libs/configs/exp/task_blocks/action_ablation.yaml
    operator_baselines: Libs/configs/exp/task_blocks/operator_baselines.yaml
    screening_baselines: Libs/configs/exp/task_blocks/screening_baselines.yaml
    ood_generalization: Libs/configs/exp/task_blocks/ood_generalization.yaml
    tri_selective_risk: Libs/configs/exp/task_blocks/tri_selective_risk.yaml
    serving_decision_eval: Libs/configs/exp/task_blocks/serving_decision_eval.yaml
    efficiency_profile: Libs/configs/exp/task_blocks/efficiency_profile.yaml
    paper_report_generation: Libs/configs/exp/task_blocks/paper_report_generation.yaml
  task_blocks:
    world_model_pretraining: Libs/configs/exp/task_blocks/world_model_pretraining.yaml
    screening_supervised: Libs/configs/exp/task_blocks/screening_supervised.yaml
    rollout_prediction: Libs/configs/exp/task_blocks/rollout_prediction.yaml
    counterfactual_evaluation: Libs/configs/exp/task_blocks/counterfactual_evaluation.yaml
    published_ad_sift_reproduction: Libs/configs/exp/task_blocks/published_ad_sift_reproduction.yaml
    architecture_ablation: Libs/configs/exp/task_blocks/architecture_ablation.yaml
    action_ablation: Libs/configs/exp/task_blocks/action_ablation.yaml
    operator_baselines: Libs/configs/exp/task_blocks/operator_baselines.yaml
    screening_baselines: Libs/configs/exp/task_blocks/screening_baselines.yaml
    ood_generalization: Libs/configs/exp/task_blocks/ood_generalization.yaml
    tri_selective_risk: Libs/configs/exp/task_blocks/tri_selective_risk.yaml
    serving_decision_eval: Libs/configs/exp/task_blocks/serving_decision_eval.yaml
    efficiency_profile: Libs/configs/exp/task_blocks/efficiency_profile.yaml
    paper_report_generation: Libs/configs/exp/task_blocks/paper_report_generation.yaml
  experiment_families:
  - neuronsifter_full
  - neuronsifter_scratch
  - rollout_operator_without_mechanism_experts
  - rollout_operator_without_diffusion
  - rollout_operator_without_graph_wavelet
  - rollout_operator_without_stochastic_uq
  - screening_without_tri_gate
  - action_occupancy_conditioned
  - action_drug_id_conditioned
  - action_target_only
  - action_pk_only
  - transolver_operator_baseline
  - factor_coupled_operator_baseline
  - external_evidence_only
  - shared_latent_logistic
  - shared_latent_mlp
  - descriptor_ml_baseline
  - kg_gnn_drug_repurposing_baseline
  baseline_families:
