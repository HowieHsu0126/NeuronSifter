    output_root: Output/results/published_ad_sift_reproduction
    audit_json: Output/audits/published_ad_sift_reproduction_audit.json
    audit_md: Output/audits/published_ad_sift_reproduction_audit.md
    claim_language:
      allowed:
      - retrospective literature-direction recovery
      - intervention-prioritization consistency
      forbidden:
      - direct clinical endpoint prediction
      - prospective efficacy prediction
      - patient-level longitudinal supervision
  external_evidence_only_baseline:
