public_foundation_corpus:
  contract_version: '1.0.0'
  corpus_version: public_foundation_corpus_v1
  schema_path: Libs/configs/schema/public_foundation_corpus.schema.json
  audit_output_path: Output/audits/public_foundation_corpus_contract_audit.json
  evidence_bundle_schema_path: Libs/configs/schema/public_foundation_corpus_evidence.schema.json
  evidence_bundle_output_path: Output/audits/public_foundation_corpus_evidence_bundle.json
  scope: reduced_transcriptomics_core
  source_discovery_freeze_date: '2026-07-31'

  semantic_alignment:
    alignment_kind: semantic_canonical_alignment
    same_subject_cross_modal_pairing_required: false
    required_axes:
    - study
    - biological_unit
    - species
    - disease_state
    - tissue
    - brain_region
    - cell_type
    - assay
    - modality
    - feature
    - time
    - dose
    - unit
    - provenance
    missing_required_axis_policy: quarantine
    longitudinal_evidence_requires_real_subject_and_time: true

  disease_programs:
  - program_id: ad_control
    disease_family: AD
  - program_id: pd_control
    disease_family: PD
  - program_id: ftd_control
    disease_family: FTD
  - program_id: als_control
    disease_family: ALS
  - program_id: neuroinflammation_control
    disease_family: neuroinflammation

  core_observation_families:
  - family_id: cns_disease_aging_state_transcriptomics
    modality: transcriptomics
    minimum_independent_source_ids: 2
    independent_group_key: publication_accession_group
    nonoverlapping_publication_accession_groups_required: true
    minimum_cns_sources: 1
    mirrored_accessions_count_as_independent: false
  - family_id: cns_cell_type_region_atlas_transcriptomics
    modality: transcriptomics
    minimum_independent_source_ids: 2
    independent_group_key: publication_accession_group
    nonoverlapping_publication_accession_groups_required: true
    minimum_cns_sources: 1
    mirrored_accessions_count_as_independent: false
  - family_id: compound_dose_time_perturbation_transcriptomics
    modality: transcriptomics
    minimum_independent_source_ids: 2
    independent_group_key: publication_accession_group
    nonoverlapping_publication_accession_groups_required: true
    minimum_cns_sources: 1
    mirrored_accessions_count_as_independent: false

  deferred_modalities:
  - modality: epigenomics
    allowed_roles: &deferred_roles
    - context_prior
    - weak_calibration
    - holdout_extension
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: genomics
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: gwas
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: proteomics
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: metabolomics
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: lipidomics
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: electrophysiology
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: morphology
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false
  - modality: imaging
    allowed_roles: *deferred_roles
    counts_toward_core_ess: false
    counts_toward_core_g2: false
    primary_supervision_allowed: false

  source_governance:
    access_policy: strict_public_only
    silent_source_substitution_allowed: false
    required_release_fields:
    - source_id
    - official_url
    - release_version
    - retrieval_date
    - source_card_path
    - terms_snapshot_path
    - terms_snapshot_sha256
    - license_snapshot_path
    - license_snapshot_sha256
    - raw_sha256
    - processed_sha256
    - parser_id
    - parser_version
    - mapping_version
    - provenance_record_id
    - training_evaluation_role
    - holdout_group
    - publication_accession_group
    - access_class
    allowed_access_classes:
    - public_unrestricted
    - public_with_attribution
    qualification_failure_policy: quarantine

  controlled_exclusions:
    public_mainline_dependency_allowed: false
    required_public_mainline_reachability_count: 0
    preserve_isolation_audit: true
    sources:
    - source_id: adni
      access_class: controlled_or_restricted
      public_mainline_role: excluded_audit_only
    - source_id: dbgap
      access_class: controlled_or_restricted
      public_mainline_role: excluded_audit_only
    - source_id: uk_biobank
      access_class: controlled_or_restricted
      public_mainline_role: excluded_audit_only
    - source_id: rosmap
      access_class: controlled_or_restricted
      public_mainline_role: excluded_audit_only
    - source_id: amp_ad
      access_class: controlled_or_restricted
      public_mainline_role: excluded_audit_only
    - source_id: restricted_synapse
      access_class: controlled_or_restricted
      public_mainline_role: excluded_audit_only

  crosswalk_contract:
    entity_types:
    - gene
    - protein
    - compound
    - cell_type
    - brain_region
    - assay
    - disease
    - publication
    - species
    - unit
    unit_ontologies:
    - UCUM
    - UO
    critical_mapping_conflict_limit: 0
    unresolved_required_mapping_policy: quarantine

  canonical_observation_contract:
    raw_matrix_migration_input_only: true
    accepted_value_block_formats:
    - zarr
    - parquet
    - h5ad
    required_manifest_fields:
    - block_sha256
    - ontology_versions
    - unit_mapping_version
    - qc_grade
    - mapping_confidence
    - split_role
    synthetic_values_allowed: false

  structured_action_contract:
    required_fields:
    - action_uid
    - intervention_type
    - target_set
    - agent_set
    - dose_value
    - dose_unit
    - schedule
    - route
    - assay_context
    - state_scope
    - source_publication
    - source_accession
    - exposure_program_ref
    - occupancy_program_ref
    incomplete_record_policy: quarantine

  tool_model_registry_contract:
    required_fields:
    - tool_family
    - tool_name
    - tool_version
    - official_reference
    - parser_or_adapter_version
    - smoke_status
    generated_trajectories_count_as_observations: false

  quality_and_training_roles:
    grade_roles:
      A: main_training
      B: main_training
      C: weak_calibration
      D: reject
      S: stress_test_only
    main_training_grades:
    - A
    - B
    core_ess_grades:
    - A
    - B
    synthetic_teacher_policy:
      observation_coverage_eligible: false
      core_g2_eligible: false
      main_training_eligible: false

  split_policy:
    query_domain_status: frozen
    split_manifest_status: frozen
    deterministic_assignment: hash_grouped_after_freeze
    split_seed_required_at_freeze: true
    deterministic_seed: neuronsifter-public-foundation-corpus-v1-split-20260718
    query_domain_freeze_date: '2026-07-18'
    split_manifest_freeze_date: '2026-07-18'
    validation_group_fraction: 0.2
    split_root: Input/canonical/public_foundation_corpus_v1/splits/reduced_transcriptomics_core_v1
    split_manifest_path: Output/audits/public_foundation_corpus_split_manifest.json
    nested_split_order:
    - source_holdout
    - publication_accession_holdout
    - family_holdout
    - regimen_holdout
    - target_program_holdout
    required_zero_overlap_keys:
    - canonical_uid
    - content_hash
    - family_uid
    - regimen_uid
    - target_program_proxy
    - source_holdout_role
    adversarial_leakage_injection_required: true

  cross_modal_claim_policy:
    semantic_alignment_sufficient_for_prediction_claim: false
    cross_modal_prediction_claim_allowed: false
    required_paired_benchmark_kind: real_paired_subset
    synthetic_or_inferred_pairs_eligible: false
    absent_benchmark_report_policy: remove_claim
    paired_benchmark:
      status: not_available
      provenance_kind: real_only
      real_pair_count: 0

  storage_policy:
    counted_persistent_classes:
    - raw
    - processed
    - canonical
    - cache
    - output
    decimal_byte_cap: 1000000000000
    cap_exceeded_gate_policy: fail
    large_raw_assets_git_tracked_allowed: false
    content_addressed_storage_required: true
    scan_root_paths:
      raw: Input/raw
      processed: Input/processed
      canonical: Input/canonical
      cache: Input/cache
      output: Output
    scan_excluded_paths:
    - Output/audits/public_foundation_corpus_storage_ledger.json
    previous_confirmed_usage_bytes: 422655337981
    largest_directory_limit: 20
    storage_ledger_schema_path: Libs/configs/schema/public_foundation_corpus_storage_ledger.schema.json
    storage_ledger_path: Output/audits/public_foundation_corpus_storage_ledger.json
    storage_validation_path: Output/audits/public_foundation_corpus_storage_validation.json

  g2_m1_admission_audit:
