  mandatory_requirements:
  - {requirement_id: req_orchestration_gates, owning_contract_id: orchestration-gates, statement: Preserve G0-G8 order and fail-closed handoffs.}
  - {requirement_id: req_contract_round_no_jobs, owning_contract_id: orchestration-gates, statement: Start no implementation, data, training, tool, active-learning, or GPU jobs in this round.}
  - {requirement_id: req_scope_claims, owning_contract_id: scope-claims, statement: Keep foundation, digital-twin, reliability, and cost claims gate-controlled.}
  - {requirement_id: req_naming_migration, owning_contract_id: naming-migration, statement: Preserve an explicit bounded compatibility migration contract.}
  - {requirement_id: req_public_neuronsifter_identity, owning_contract_id: naming-migration, statement: Use NeuronSifter as the only external model identity.}
  - {requirement_id: req_system_architecture, owning_contract_id: system-architecture, statement: Preserve structured state, world action, tool acquisition, uncertainty, and TRI interfaces.}
  - {requirement_id: req_public_data_governance, owning_contract_id: public-data-governance, statement: Admit only provenance-complete public sources to the public mainline.}
  - {requirement_id: req_controlled_access_exclusion, owning_contract_id: public-data-governance, statement: Exclude controlled-access sources from public manifests, runs, reports, and release.}
  - {requirement_id: req_source_governance, owning_contract_id: source-governance, statement: Require official URL, terms, version, checksums, parser, and train-eval role.}
  - {requirement_id: req_literature_positioning, owning_contract_id: literature-positioning, statement: Keep neighbor evidence versioned and do not copy reported values as results.}
  - {requirement_id: req_claim_registry, owning_contract_id: claim-registry, statement: Freeze exact v2 C1-C5 identifiers and meanings.}
  - {requirement_id: req_claim_results_pending, owning_contract_id: claim-registry, statement: Keep every C1-C5 result status requires_experiment_result.}
  - {requirement_id: req_experiment_statistics, owning_contract_id: experiment-statistics, statement: Preserve paired intervals, declared directions, and visible failures.}
  - {requirement_id: req_validation_only_calibration, owning_contract_id: experiment-statistics, statement: Use validation only for calibration, thresholds, checkpoints, and tuning.}
  - {requirement_id: req_experiment_execution, owning_contract_id: experiment-execution, statement: Bind future runs to frozen configs, manifests, splits, checkpoints, and environments.}
  - {requirement_id: req_roadmap_gates, owning_contract_id: roadmap-gates, statement: Active roadmap lineage owns sequencing and gate transitions.}
  - {requirement_id: req_tool_acquisition, owning_contract_id: tool-acquisition, statement: Evaluate learned acquisition under fixed budgets and fixed targets with real rounds.}
  - {requirement_id: req_repository_implementation, owning_contract_id: repository-implementation, statement: Reuse existing repository components and avoid parallel official pipelines.}
  - {requirement_id: req_command_acceptance, owning_contract_id: command-acceptance, statement: Map target commands to maintained repository entrypoints and visible acceptance.}
  - {requirement_id: req_artifact_schema, owning_contract_id: artifact-schema, statement: Preserve schema-valid provenance and immutable result identities.}
  - {requirement_id: req_validation_acceptance, owning_contract_id: validation-acceptance, statement: Exercise real loaders, schemas, validators, and output contracts.}
  - {requirement_id: req_no_acceptance_standins, owning_contract_id: validation-acceptance, statement: Forbid mocks, fixtures, caches, and synthetic substitutes from full acceptance.}
  - {requirement_id: req_no_silent_fallback, owning_contract_id: validation-acceptance, statement: Fail visibly on missing or invalid mandatory inputs.}
  - {requirement_id: req_hpc_observability, owning_contract_id: hpc-observability, statement: Record Slurm jobs, terminal states, resource use, and failures.}
  - {requirement_id: req_integrity_claim_discipline, owning_contract_id: integrity-claim-discipline, statement: Preserve naming, scope, numeric, path, citation, and claim boundaries.}
  - {requirement_id: req_publication_gates, owning_contract_id: publication-gates, statement: Generate publication wording only from frozen schema-valid result catalogs.}
  - {requirement_id: req_reproducibility_release, owning_contract_id: reproducibility-release, statement: Exclude controlled data, secrets, personal paths, and nonredistributable artifacts.}
  - {requirement_id: req_repository_ownership, owning_contract_id: repository-ownership, statement: Extend the inspected Libs architecture without duplicate directory trees.}
  - {requirement_id: req_implementation_ledger, owning_contract_id: implementation-ledger, statement: Separate implemented, empirically validated, and accepted task states.}
  - {requirement_id: req_data_materialization, owning_contract_id: data-materialization, statement: Require real public materialization and frozen zero-overlap splits.}
  - {requirement_id: req_tool_adapter_security, owning_contract_id: tool-adapter-security, statement: Restrict tool execution to typed registered commands with complete provenance.}
  - {requirement_id: req_model_training_evaluation, owning_contract_id: model-training-evaluation, statement: Preserve strict holdouts, stochastic UQ, constraints, and validation-only selection.}
  - {requirement_id: req_source_traceability, owning_contract_id: source-traceability, statement: Resolve precedence by fact domain and preserve source lineage.}
  - {requirement_id: req_package_quality, owning_contract_id: package-quality, statement: Distinguish design validation from implementation and empirical deployment.}
  - {requirement_id: req_package_metadata, owning_contract_id: package-metadata, statement: Treat generated indexes and history as package evidence rather than runtime authority.}
