publication_query:
  database: pubmed
  result_order: pub_date
  maximum_date: '2021/03/02'
  minimum_date: '1900/01/01'
  query_template: '({intervention}[All Fields]) AND (exposure[All Fields] OR occupancy[All Fields] OR "blood brain barrier"[All Fields] OR "cns transport"[All Fields] OR "amyloid beta"[All Fields] OR tau[All Fields] OR "protein pathology"[All Fields] OR neuroinflammation[All Fields] OR microglia[All Fields] OR electrophysiology[All Fields] OR neuronal[All Fields] OR morphology[All Fields] OR structural[All Fields]) AND ("1900/01/01"[Date - Publication] : "2021/03/02"[Date - Publication])'
  search_method: GET
  summary_method: GET
  headers:
    Accept: application/json
    User-Agent: NeuronSifter-MechanismSourceQueue/1.0
  response_content_types:
    - application/json
    - text/json
  allowed_response_fields:
    search:
      - esearchresult.idlist
    summary:
      - result.uids
      - result.<pmid>.uid
      - result.<pmid>.sortpubdate
      - result.<pmid>.articleids.idtype
      - result.<pmid>.articleids.value
  forbidden_response_fields:
    - title
    - abstract
    - result_prose
    - conclusions
    - efficacy
    - effect
    - ranking
    - figure
    - supplement
    - citation_context

response_field_policy:
  allowed_by_family:
    publication_metadata:
      - esearchresult.idlist
      - result.uids
      - result.<pmid>.uid
      - result.<pmid>.sortpubdate
      - result.<pmid>.articleids.idtype
      - result.<pmid>.articleids.value
    open_targets_target_metadata: []
    chembl_compound_target_metadata: []
    bindingdb_record_metadata: []
    drugcentral_drug_moa_metadata: []
    dgidb_drug_gene_metadata: []
  forbidden_for_every_family:
    - title
    - abstract
    - full_text
    - result_prose
    - conclusions
    - efficacy
    - effect
    - ranking
    - figure
    - supplement
    - citation_context
    - outcome
    - source_content

request_policy:
  maximum_requests: 48
  concurrency: 1
  timeout_seconds: 30
  retries: 0
  maximum_response_bytes: 2097152
  maximum_total_response_bytes: 33554432
  maximum_redirects: 3
  minimum_request_interval_ms: 400
  allowed_host_suffixes:
    - ncbi.nlm.nih.gov
  raw_response_persistence_allowed: false
  response_value_logging_allowed: false

queue_policy:
  family_cap: 6
  global_slot_cap: 160
  per_intervention_slot_cap: 12
  exact_slots_per_intervention: 12
  identity_normalization:
    pmid: digits_only
    doi: lowercase_trimmed
    structured_database_records: family_scoped_no_fuzzy_merge
  deduplication_key:
    - canonical_intervention_uid
    - canonical_source_identity
  disposition_precedence:
    - forbidden_metadata
    - request_failed
    - cutoff_ineligible_release
    - source_date_ambiguous
    - access_license_ambiguous
    - unavailable
    - duplicate
    - eligible
  ordering:
    - canonical_intervention_uid
    - mechanism_tag_priority
    - family_priority
    - official_date_ascending
    - source_type
    - canonical_source_identity
    - family_slot_ordinal
  no_refill_after_exclusion: true
  no_replacement_after_preregistration: true

artifacts:
  preregistration: Input/manifests/mechanistic_belief/mechanism_source_preregistration.json
  queue: Input/manifests/mechanistic_belief/mechanism_source_queue.json
  chronology: Output/audits/mechanism_source_queue_chronology.json
  content_authorization: Output/audits/mechanism_source_content_authorization.json

