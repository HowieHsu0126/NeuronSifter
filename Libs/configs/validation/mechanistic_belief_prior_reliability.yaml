    scientific_meaning: uncertainty_over_admitted_mechanism_structure_or_activation_assumptions
  - component_uid: parameter_uncertainty
    scientific_meaning: uncertainty_within_frozen_parameter_domain_and_distribution_family
  - component_uid: support_uncertainty
    scientific_meaning: categorical_provenance_status_for_incomplete_or_contradictory_evidence_coverage
  - component_uid: context_model_form_uncertainty
    scientific_meaning: mismatch_between_declared_context_and_modeled_mechanism_or_observation_assumptions_including_sensitivity_disagreement
support_contract:
  precedence:
    - UNSUPPORTED
    - OOD
    - PARTIAL_SUPPORT
    - SUPPORTED
  states:
    - support_state: UNSUPPORTED
      scientific_meaning: required_action_mechanism_parameter_observable_or_provenance_semantics_absent_or_contradictory
      execution_disposition: prohibited
      distribution_reporting: unavailable
      mandatory_abstention: true
      abstention_reason_code: REQUIRED_SEMANTICS_UNSUPPORTED
      binary_decision_authorized: false
    - support_state: OOD
      scientific_meaning: semantics_representable_but_required_dimension_outside_future_frozen_support_domain
      execution_disposition: diagnostic_only
      distribution_reporting: diagnostic_only
      mandatory_abstention: true
      abstention_reason_code: OUTSIDE_FROZEN_SUPPORT_DOMAIN
      binary_decision_authorized: false
    - support_state: PARTIAL_SUPPORT
      scientific_meaning: no_contradiction_or_ood_breach_but_required_support_dimension_incomplete
      execution_disposition: distribution_with_explicit_missingness
      distribution_reporting: continuous_only
      mandatory_abstention: false
      abstention_reason_code: null
      binary_decision_authorized: false
    - support_state: SUPPORTED
      scientific_meaning: all_required_dimensions_satisfy_future_frozen_support_contract
      execution_disposition: distribution_reporting_permitted
      distribution_reporting: continuous_only
      mandatory_abstention: false
      abstention_reason_code: null
      binary_decision_authorized: false
