      semantic_role: initial_prior_without_action_conditioned_temporal_propagation
      distributional_spread: retained_without_invented_response_trajectory
      abstention_behavior: preserve_structural_support_state
      diagnostic_only: true
    - form_uid: point_estimate
      method_uid: mechanistic_belief_twin_v1
      semantic_role: prespecified_distributional_summary_of_same_mechanistic_mapping
      distributional_spread: suppressed_for_diagnostic_comparison
      abstention_behavior: preserve_structural_support_state
      diagnostic_only: true
    - form_uid: forced_decision
      method_uid: mechanistic_belief_twin_v1
      semantic_role: same_pairwise_distribution_with_code_pinned_tie_rule
      distributional_spread: retained_in_receipt
      abstention_behavior: suppress_decision_abstention_but_retain_full_form_abstention_receipt
      diagnostic_only: true
    - form_uid: full_belief_twin
      method_uid: mechanistic_belief_twin_v1
      semantic_role: prior_predictive_distribution_with_support_uncertainty_pairwise_outputs_and_abstention
      distributional_spread: retained
      abstention_behavior: structural_no_fit_contract
      diagnostic_only: false
  shared_identity_required: true
  preferred_form: null
  winner_selection_allowed: false
