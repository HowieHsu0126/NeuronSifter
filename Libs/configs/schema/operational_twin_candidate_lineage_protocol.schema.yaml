operational_twin_candidate_lineage_protocol_schema:
  schema_version: neuronsifter-operational-twin-candidate-lineage-protocol-schema-v3
  protocol_schema_version: neuronsifter-operational-twin-candidate-lineage-protocol-v3
  required_top_level_fields:
  - schema_version
  - authoritative_date
  - evidence_class
  - candidate_lineage_uid
  - protocol_uid
  - parent_candidate_lineage_uid
  - initialization
  - identity_policy
  - scientific_contract
  - historical_boundary
  - sealed_manifest_metadata
  - scheduler_evidence_contract
  - supersession_contract
  - execution_authority_contract
  - execution_contract
  - output_paths
  - source_bindings
  - access_counters
  - closed_flags
  - terminal_policy
  required_identity_fields: &required_identity_fields
  - candidate_lineage_uid
  - protocol_uid
  - assignment_uid
  - attempt_uid
  identity_policy:
    type: object
    required:
    - candidate_lineage_uid_prefix
    - protocol_uid_prefix
    - assignment_uid_prefix
    - attempt_uid_template
    - required_identity_fields
    - manifest_provided_attempt_uid_required
    - directory_derived_attempt_uid_forbidden
    properties:
      candidate_lineage_uid_prefix:
        const: operational_twin_candidate_lineage
      protocol_uid_prefix:
        const: operational_twin_candidate_protocol
      assignment_uid_prefix:
        const: operational_twin_candidate_assignment
      attempt_uid_template:
        const: '{assignment_uid}__{attempt_kind}'
      required_identity_fields:
        const: *required_identity_fields
      manifest_provided_attempt_uid_required:
        const: true
      directory_derived_attempt_uid_forbidden:
        const: true
    additionalProperties: false
  forbidden_state_input_fields:
  - resume_input
  - history_input
  - checkpoint_input
  - optimizer_state_input
  - model_state_input
  - calibration_state_input
  required_method_ids:
  - persistence_no_action
  - linear_or_delta
  - same_backbone_no_action
  - deterministic_action_conditioned
  - full_uncertainty_aware_action_conditioned
  required_seeds:
  - 360101
  - 360211
  - 360307
  required_assignment_count: 15
  required_attempt_kinds:
  - initial
  - infrastructure_recovery_01
  maximum_attempts_per_assignment: 2
  historical_boundary:
    type: object
    required:
