      - source_accession: drugcomb
        asset_name: manual_collection_gate
        required_artifact_pattern: '*about*.html|*download*.html|*api*.html|*.csv|*.tsv|*.zip'
        description: Public DrugComb descriptors or downloadable metadata captured
