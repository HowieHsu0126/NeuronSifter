sources:
  oasis:
    source_name: OASIS
    source_url: https://dev.oasis-brains.org/
    release_label: public_snapshot
    release_date: null
    access_mode: click_through_terms
    license_or_terms: non-commercial academic use with anti-reidentification restrictions
    disease_scope:
    - Alzheimer disease
    - mild cognitive impairment
    - normal aging
    modality_scope:
    - clinical
    - cognitive
    - biomarker
    - imaging_optional
    query_scope: historical_optional only; historical OASIS-3 and OASIS-4 tabular snapshots
      remain preserved outside the v2 mainline
    local_root: Input/raw/oasis
    checksum_file: checksums/sha256.tsv
    required_subdirs:
    - downloads
    - downloads/manual_drop
    - manifests
    - terms
    - checksums
    - tabular
    - imaging_optional
    snapshot_urls:
    - filename: oasis_landing_page.html
      url: https://dev.oasis-brains.org/
    - filename: oasis_access_page.html
      url: https://sites.wustl.edu/oasisbrains/access/
    term_urls:
    - filename: oasis_terms_snapshot.html
      url: https://sites.wustl.edu/oasisbrains/access/
    notes: Legacy optional source retained for traceability only. OASIS no longer
      participates in the v2 public mainline or benchmark completion gate.
    include_targets:
    - OASIS-3 clinical tables
    - OASIS-3 cognitive tables
    - OASIS-3 biomarker tables
    - OASIS-4 public tabular metadata when aligned with AD or aging
    exclude_targets:
    - raw image archives during startup
    - non-AD or non-aging disease programs
  allen_brain_cell_atlas:
    source_name: Allen Brain Cell Atlas
