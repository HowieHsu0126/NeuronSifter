    - role_uid: canonical_mechanism_prior
      role_class: canonical
      required: true
      population_source: future_admitted_mechanism_basis_only
      selection_allowed: false
      reporting_rule: report_as_canonical_without_target_task_selection
    - role_uid: conservative_support_sensitivity
      role_class: sensitivity
