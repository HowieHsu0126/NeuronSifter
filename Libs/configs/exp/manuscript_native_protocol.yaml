native_rssm_prediction:
  fitted_methods: [planet, dreamerv3]
  scope: partial_observation_world_model_prediction_component
  target_boundary: future_teacher_filtering_only_during_fit_prior_only_forecasts
  shared_conditioning: same_selected_native_posterior_all_particles_and_actions
  native_adaptations:
  - vector_encoder_decoder_for_complete_masked_native_fields
  - initial_state_and_complete_particle_context_conditioning
  - declared_native_clock_and_program_scales_without_actor_action_clipping
  - mean_supported_coordinate_loss_then_time_and_independent_group_reduction
  - shared_native_AdamW_learning_rate_schedule_and_gradient_clipping
  - pytorch_layer_initialization_and_explicit_native_RMS_epsilon
  dreamerv3_optimizer_difference: native_AdamW_and_norm_clipping_instead_of_LaProp_and_AGC
  observation_measurement_law: source_declared_readout_law_in_common_frozen_belief_separate_from_RSSM_decoder
  gaussian_prediction_law: stochastic_Gaussian_latents_and_unit_Gaussian_normalized_field_decoder
  dreamerv3_prediction_law: categorical_latent_point_decoder_pushforward_uncalibrated
  dreamerv3_observation_residual: not_fitted_or_claimed
  evaluation_metrics: [sample_CRPS, empirical_sample_coverage, normalized_RMSE]
  gaussian_reuse: Dreamer_and_PlaNet_identical_matched_RSSM_predictor_one_fit
native_learned_distillation:
  enabled: false
  loss: masked_categorical_kl
  weight: 0.1
  teacher_config: null
  teacher_manifest: null
  development_selection: unchanged_native_objective
