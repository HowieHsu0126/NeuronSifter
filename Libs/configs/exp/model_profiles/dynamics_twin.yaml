    - '{python_executable} -u Libs/scripts/validators/validate_external_adapter_registry.py --config {config_path} --strict-processed'
    - '{python_executable} -u Libs/scripts/builders/build_world_state_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_world_state_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_crossmodal_anchor_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_crossmodal_anchor_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/builders/build_simulation_teacher_ready_registry.py --config {config_path}'
    - '{python_executable} -u Libs/scripts/validators/validate_simulation_teacher_ready_registry.py --config {config_path}'
