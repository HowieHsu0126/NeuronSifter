schema_version: neuronsifter-round11f-controller-authority-v1
authority_uid: GateWriterAuthority
canonical_controller:
  component_uid: neuronsifter_orchestration_controller
  entrypoint: Libs/scripts/builders/build_dt_round11f_controller_contracts.py
  responsibilities:
    - config_resolution
    - stage_gate_orchestration
    - artifact_dependency_checks
    - validator_invocation
    - terminal_state_aggregation
    - canonical_gate_decision_writing
  prohibited_responsibilities:
    - data_parsing
    - model_training
    - scientific_tool_implementation
    - metric_calculation
    - literature_extraction
    - llm_hypothesis_generation
formal_gate:
  schema_version: neuronsifter-gate-writer-authority-v1
  writer_uid: neuronsifter_orchestration_controller
  approved_validators:
    - validator_uid: round11f_controller_union_lineage_validator
      stage_uids:
        - round_11f_controller_lineage
    - validator_uid: round11g_targeted_repair_full_suite_validator
      stage_uids:
        - round_11g_targeted_repair_and_full_suite_closure
  disallowed_writer_kinds:
    - builder_direct
    - test_direct
    - markdown_direct
    - llm_agent
    - baseline_pipeline
    - latest_pointer
artifact_policy:
  require_input_artifact_hashes: true
  require_config_hash: true
  require_git_commit: true
  require_lineage_parent: true
  latest_pointer_is_evidence: false
  markdown_is_status_source: false
evidence_union:
  mode: artifact_level_only
  conflict_policy: fail_closed
  rejected_conflict_states:
    - semantic_conflict
    - unknown
  preserve_fields:
    - evidence_type
    - qc_grade
    - train_eval_role
    - claim_eligibility
    - provenance_status
    - independence_group
roadmap_lineage:
  sequence:
    - Round-11
    - Round-11C
    - Round-11D
    - Round-11E
    - Round-11F
    - Round-11G
  round_12_required_parent:
    stage_uid: round_11g_targeted_repair_and_full_suite_closure
    closure: accepted
read_only_inputs:
  - TODO.md
  - orchestrator/state.json
  - Libs/configs/config_stack.yaml
  - Libs/configs/validation/iclr_design_contract_union.yaml
  - Output/audits/dt_round11d_full_suite_execution.json
  - Output/audits/dt_round11d_full_suite_results.xml
  - Output/audits/dt_round11d_full_suite_failure_triage.json
  - Output/audits/dt_round11_closure_decision.json
  - Output/audits/dt_round11e_targeted_gate.json
  - Output/audits/dt_round11e_repair_wave_record.json
  - Output/audits/dt_round11e_testcase_failure_ledger.tsv
