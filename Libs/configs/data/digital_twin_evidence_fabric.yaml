evidence_fabric_v0:
  version: evidence_fabric_v0
  status: materialized_unsealed
  sealed: false
  layers: [E0, E1, E2, E3, E4, E5, E6, E7]
  admission_phases:
  - discovered
  - source_verified
  - license_or_access_verified
  - content_hashed
  - parsed
  - canonicalized
  - typed
  - relationship_validated
  - support_domain_validated
  - QC_graded
  - eligibility_assigned
  - admitted_or_rejected
  terminal_states:
  - admitted_strong
  - admitted_weighted
  - admitted_weak
  - admitted_stress
  - admitted_legacy_restricted
  - quarantined
  - rejected_license
  - rejected_provenance
  - rejected_schema
  - rejected_identity
  - rejected_relationship
  - rejected_support_domain
  - rejected_hash
  source_paths:
    foundation_observation_blocks: Output/audits/public_foundation_corpus_v2_canonical_observation_blocks.json
    legacy_trajectory_catalog: Input/processed/simulation_audit/simulation_qc_catalog.tsv
    mechanistic_model_catalog: Input/processed/full_microenvironment_teacher_ready/source_model_catalog.tsv
    round12_relationship_graph: Output/audits/dt_round12_relationship_graph.json
    round13_action_observation_graph: Output/audits/dt_round13_action_observation_graph.json
  output_paths:
    release_manifest: Output/evidence_fabric/v0/evidence_fabric_release_manifest.json
    source_manifest: Output/evidence_fabric/v0/evidence_source_manifest.parquet
    admission_ledger: Output/evidence_fabric/v0/evidence_admission_ledger.parquet
    rejection_ledger: Output/evidence_fabric/v0/evidence_rejection_quarantine_ledger.parquet
    node_catalog: Output/evidence_fabric/v0/evidence_node_catalog.parquet
    relation_catalog: Output/evidence_fabric/v0/evidence_relation_catalog.parquet
    pairing_catalog: Output/evidence_fabric/v0/evidence_pairing_catalog.parquet
    support_domain_catalog: Output/evidence_fabric/v0/evidence_support_domain_catalog.parquet
    eligibility_catalog: Output/evidence_fabric/v0/evidence_eligibility_catalog.parquet
    conflict_catalog: Output/evidence_fabric/v0/evidence_conflict_catalog.parquet
    world_action_catalog: Output/evidence_fabric/v0/world_action_catalog.parquet
    information_action_catalog: Output/evidence_fabric/v0/information_action_catalog.parquet
    canonical_observation_catalog: Output/evidence_fabric/v0/canonical_observation_catalog.parquet
  e0:
    canonicalization_version: neuronsifter-e0-canonicalization-v1
    organism_registry:
    - canonical_uid: NCBITaxon:9606
      label: human
    - canonical_uid: NCBITaxon:10090
      label: mouse
    unit_registry:
    - source_unit: uM
      canonical_unit: umol/L
      conversion: identity_dimension_equivalent
    - source_unit: microM
      canonical_unit: umol/L
      conversion: identity_dimension_equivalent
    - source_unit: h
      canonical_unit: hour
      conversion: identity_time_equivalent
    - source_unit: month
      canonical_unit: month
      conversion: identity
    - source_unit: raw_count
      canonical_unit: raw_count
      conversion: identity_non_ucum
    - source_unit: FPKM
      canonical_unit: FPKM
      conversion: identity_non_ucum
    action_vocabulary:
    - pharmacological
    - genetic
    - electrical_stimulation
    - optical_stimulation
    - environmental
    - state_initialization
    - no_action_control
    - combination
    observation_vocabulary:
    - real_static_state
    - real_perturbation_endpoint
    - canonical_tool_observation
    - legacy_simulator_trajectory
    - published_mechanistic_model
    - hypothetical_scenario
