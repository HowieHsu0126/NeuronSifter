    - PD readiness
    - FTD readiness
    - ALS readiness

  native_rollout_evaluation:
    predictor_kind: native_diffusion
    regimen_chunk_size: 0
    source_role: development
    sample_uids: []
    regimen_uids: []
    checkpoint_scope: folds
    checkpoint_split_name: ''
    crps_estimator: off_diagonal_finite_ensemble
    quantile_interpolation: linear
    cell_reduction: equal_valid_cells
    episode_reduction: equal_episode
    episode_field: sample_uid
    group_field: family_uid
    group_kind: action_family

  native_causal_prefix_evaluation:
    estimator: off_diagonal_paired_energy_u
    distance: joint_prefix_l2_over_sqrt_valid_coordinates
    prefix: strictly_before_future_knot_exclude_initial
    mask: exact_common_declared_prefix
    monte_carlo_uncertainty: delete_one_paired_draw_jackknife
    aggregation: contrasts_within_episode_then_equal_episode
    dtype: float64
    causal_decision_rule_status: unbound
    contrasts: []

  native_transolver_residual:
    law: native_transolver_teacher_readout_brownian.v1
    reference_time_hours: 672.0
    source_role: calibration
    group_field: family_uid
    readout_kind: independent_mechanistic_teacher_readout
    missingness: ignorable_given_conditions_and_mask
    fit_groups: []
    check_groups: []
    frozen_artifact_path: ''
    frozen_artifact_sha256: ''
    residual_seed: 73407
    diagnostics: [adjacent_retained_times, native_graph_edges, cross_species_pairs]
    numerical:
      dtype: float64
      eta_initialization: 0.0
      optimizer: torch_lbfgs
      line_search: strong_wolfe
      history_size: 10
      max_iterations: 200
      max_closure_evaluations: 400
      gradient_tolerance: 1.0e-7
      change_tolerance: 1.0e-12
      hessian_absolute_threshold: 1.0e-10
      hessian_relative_threshold: 1.0e-8
