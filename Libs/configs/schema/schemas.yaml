  source_membrane_charge_registration:
    step_ledger:
      sample_columns:
      - end_time_ms
      - voltage_mV
      - left_voltage_mV
      - right_voltage_mV
      - membrane_current_nA
      - capacitive_current_mA_cm2
      - electrode_current_nA
      - assembled_ionic_current_mA_cm2
      units:
        end_time_ms: ms
        voltage_mV: mV
        left_voltage_mV: mV
        right_voltage_mV: mV
        membrane_current_nA: nA
        capacitive_current_mA_cm2: mA/cm2
        electrode_current_nA: nA
        assembled_ionic_current_mA_cm2: mA/cm2
    optional_sample_columns: [interval_electrode_nA]
    declaration_required_fields:
    - schema_version
    - declaration_uid
    - policy
    - units
    - schema
    - source
    - build
    - site
    - state_variables
    - source_parameters
    - implementation
    - execution
    trace_required_fields:
    - schema_version
    - declaration_uid
    - condition
    - site
    - units
    - build_identity
    - status
    # attempt_started is a strict boolean or null (unknown), never numeric 0/1.
    - attempt_started
    - samples
    - observed_mask
    # Known advances are nonnegative integers within the declared interval budget;
    # bools/floats are invalid. Null means unknown; COMPLETE requires the full count.
    - source_time_advanced_count
    - error
    - cost
    units:
      time: ms
      voltage: mV
      electrode_current: nA
      ionic_current_density: mA/cm2
      axial_resistance: MOhm
      area: um2
      specific_capacitance: uF/cm2
      capacitance: nF
      charge: pC
      state_gates: dimensionless
      state_ca_cad_and_cai: mM
