      requirements:
      - source_accession: clue_lincs
        asset_name: manual_collection_gate
        required_artifact_pattern: siginfo*.txt|geneinfo*.txt|pertinfo*.txt|cellinfo*.txt
        description: Minimal CLUE metadata bundle for signature-level perturbation
          modeling.
    nemo_archive:
      requirements:
      - source_accession: nemo_archive
        asset_name: manual_collection_gate
        required_artifact_pattern: '*release*.json|*collection*.json|*manifest*.tsv|*metadata*.csv'
        description: Public release or collection discovery metadata for NeMO public
          portal assets.
    drugcomb:
